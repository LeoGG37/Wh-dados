      if (u.perfilId) {
        const p = (g.perfiles || []).find(x => x.id === u.perfilId);
        if (p) Object.assign(p, campsArma());
      } else {
        Object.assign(g, campsArma());
      }
      // Editar un arma ya no toca el recuento: ese contador se fue del panel
      // y las miniaturas se cambian desde la ficha de la unidad.

    } else {
      // Arma nueva: siempre otro modo de la primera arma de la unidad, con
      // las mismas miniaturas. No se crean grupos nuevos desde la interfaz,
      // así que el invariante «los grupos no se solapan» se cumple solo y la
      // unidad no puede crecer sin querer.
      const g = un.grupos[0];
      if (!g) { alert('Esa unidad no tiene ningún arma.'); cerrarSheet(); return; }
      aMultiPerfil(g, un);
      g.perfiles.push(Object.assign({ id: uid() }, campsArma()));
    }
  }

  guardarJSON(LS_ARMIES, armies);
  trasGuardar(u.unitId);
}

function borrarArmaAlta() {
  const u = nuevaU;
  const armies = todosEjercitos();
  const ej = armies[u.ejId];
  const un = ej && ej.unidades.find(x => x.id === u.unitId);
  const g = un && un.grupos.find(x => x.id === u.grupoId);
  if (!g) { cerrarSheet(); return; }

  const p = u.perfilId ? (g.perfiles || []).find(x => x.id === u.perfilId) : null;
  const queNombre = p ? p.nombre : g.nombre;
  if (!confirm(`¿Eliminar "${queNombre}" de ${un.nombre}? No se puede deshacer.`)) return;

  if (p) g.perfiles = g.perfiles.filter(x => x.id !== u.perfilId);
  else   un.grupos = un.grupos.filter(x => x.id !== u.grupoId);

  guardarJSON(LS_ARMIES, armies);

  // Si era el arma elegida para tirar, se olvida
  if (S.atk.grupoId === u.grupoId && (!u.perfilId || S.atk.perfilId === u.perfilId)) {
    Object.assign(S.atk, { arma: null, grupoId: null, perfilId: null });
  }
  trasGuardar(u.unitId);
}

// Cierra el panel y repinta lo que haya delante. Si la unidad editada era la
// elegida para tirar, se recarga: así los dados usan los valores nuevos y no
// los que se habían copiado al estado antes de la edición.
function trasGuardar(unitId) {
  if (unitId) {
    if (S.def.unitId === unitId) elegirUnidadDef(unitId, S.def.ejId, true);
    if (S.atk.unitId === unitId && S.atk.grupoId) {
      const un = buscarUnidad(unitId);
      const armas = un ? armasDeUnidad(un) : [];
      // Si el arma elegida ya no casa exacta —acaba de convertirse en
      // multi-perfil, por ejemplo— se cae al primer perfil de ese mismo grupo
      const w = armas.find(x =>
                  x.grupoId === S.atk.grupoId && (x.perfilId || '') === (S.atk.perfilId || ''))
             || armas.find(x => x.grupoId === S.atk.grupoId);
      if (w) aplicarArma(w);
      else Object.assign(S.atk, { arma: null, grupoId: null, perfilId: null });
    }
  }
  cerrarSheet();

  const visible = id => !document.getElementById(id).classList.contains('hide');
  if (visible('vista-ejercito'))      pintarEjercito();
  else if (visible('vista-partida'))  pintarPartida();
  else                                pintarTodo();
}

// ═══════════════════════════════════════════════════════════
//  DADOS Y REGLAS
// ═══════════════════════════════════════════════════════════
// Un dado de M caras. `Math.ceil(Math.random() * 3)` daría 0 en el caso
// (rarísimo, pero existe) de que Math.random() devuelva exactamente 0.
const dN = m => Math.floor(Math.random() * m) + 1;
const d6 = () => dN(6);
const d3 = () => dN(3);

// Reconoce NdM+K: «D6», «1D6», «2D6», «D6+1», «D3+2», «2D6-1»… Antes solo
// valían las tres cadenas exactas D3, D6 y 2D6 y cualquier otra caía en el
// `parseInt`, que para «D6+1» da NaN y se quedaba en daño 1 **sin avisar**.
// Por eso el intérprete se tocó antes que la lista de opciones.
const RE_DADO = /^(\d*)D(\d+)([+-]\d+)?$/;

// Las opciones de daño, en un solo sitio: las usan el panel del arma y el
// panel rápido del lanzador, y si se escriben dos veces acaban divergiendo.
// Se escriben «D6+1» y no «1D6+1» para que casen con los «D3» y «D6» que ya
// había; el intérprete acepta las dos formas igual.
const OPC_DAÑO = ['1','2','3','4','5','6',
                  'D3','D3+1','D3+2',
                  'D6','D6+1','D6+2','D6+3',
                  '2D6'];

function resolverDado(x) {
  if (typeof x === 'number') return x;
  const m = RE_DADO.exec(String(x).toUpperCase().replace(/\s/g, ''));
  if (!m) return parseInt(x) || 1;
  const n = parseInt(m[1] || '1'), caras = parseInt(m[2]), fijo = parseInt(m[3] || '0');
  let t = fijo;
  for (let i = 0; i < n; i++) t += dN(caras);
  // El daño nunca baja de 0: un «2D6-1» que saliera por debajo no cura
  return Math.max(0, t);
}

function valorMedio(x) {
  if (typeof x === 'number') return x;
  const m = RE_DADO.exec(String(x).toUpperCase().replace(/\s/g, ''));
  if (!m) return parseInt(x) || 1;
  const n = parseInt(m[1] || '1'), caras = parseInt(m[2]), fijo = parseInt(m[3] || '0');
  return Math.max(0, n * (caras + 1) / 2 + fijo);
}

function objHerida(F, R) {
  if (F >= R * 2) return 2;
  if (F > R)      return 3;
  if (F === R)    return 4;
  if (F * 2 <= R) return 6;
  return 5;
}

// ── COBERTURA (11ª, 13.08) ──
// «Siempre que un ataque A DISTANCIA tome como blanco una unidad que se
// beneficia de cobertura contra él, empeora en 1 el atributo HP de ese
// ataque.» En 10ª sumaba 1 a la salvación, que es como estaba implementada.
// El cambio tiene dos efectos secundarios: en combate ya no cuenta, y contra
// ráfaga tampoco, porque si se impacta sin tirada no hay HP que empeorar.
const hayCobertura = () =>
  S.def.cob && !S.atk.ignCob && S.atk.tipo === 'dist' && !S.atk.rafaga;

// HP/HA necesario tras los modificadores, en un solo sitio para que la
// cobertura entre una vez y no en las tres copias que había. El tope de 6
// vale porque un 6 sin modificar impacta siempre.
// [PSÍQUICA] (24.29): «puedes ignorar cualquier modificador, o todos ellos»
// al HP/HA y a la tirada para impactar. Es opcional y se elige por ataque, así
// que la herramienta hace la jugada buena: tira los que restan (la cobertura y
// un modificador negativo) y se queda los que suman. Pesada no se ignora:
// también es un modificador, pero favorable.
const habEfectiva = () => {
  const a = S.atk;
  const cob = hayCobertura() && !a.psiquica;
  const mod = a.psiquica ? Math.max(0, a.modImp) : a.modImp;
  // [PESADA] (24.16): suma 1 a la tirada para impactar, o sea que baja en 1
  // el resultado necesario. Solo en la fase de disparo, como dice la regla.
  const pes = (a.pesada && a.tipo === 'dist') ? 1 : 0;
  return Math.max(2, Math.min(6, a.hab - mod + (cob ? 1 : 0) - pes));
};

// ── RESULTADO NECESARIO PARA HERIR (11ª, 05.02) ──
// En un solo sitio por el mismo motivo que habEfectiva(): estaba copiado en
// tres, y una copia sin arreglar deja la pantalla diciendo una cosa y los
// dados haciendo otra.
//
// El tope es 6, no 7. La tabla de la página 18 comprueba las condiciones EN
// ORDEN: el 1 sin modificar falla, el 6 sin modificar es herida crítica —y
// una herida crítica es una herida—, y solo después se mira el resultado
// requerido. O sea que un 6 hiere siempre, mire lo que mire la tabla.
// Antes topaba a 7 y pintaba «imposible»: un -1 al herir sobre un 6+ dejaba
// la tirada en cero cuando en realidad no debía cambiar nada.
// ── PERFIL EFECTIVO DEL ARMA ──
// El arma guardada no se toca: los modificadores de la tirada se aplican aquí
// y mueren con ella. Todo lo que calcule o pinte F, PA o Daño pasa por estas
// tres, nunca por S.atk.F / .FP / .D a pelo.
const fuerzaEf = () => Math.max(1, S.atk.F + (S.atk.modF || 0));
// La PA se guarda en negativo (FP:-1 = PA-1), así que un modificador negativo
// la MEJORA. El tope de 0 es porque una PA positiva no existe.
const fpEf = () => Math.min(0, S.atk.FP + (S.atk.modFP || 0));

// ── PERFIL EFECTIVO DEL DEFENSOR ──
const resistenciaEf = () => Math.max(1, S.def.R + (S.def.modR || 0));

// ── SALVACIÓN EFECTIVA (11ª, 05.04, p19) ──
// La tabla tiene DOS condiciones de éxito, y no son simétricas:
//   · Invulnerable: el resultado **sin modificar** iguala o supera el Inv.
//   · Armadura:     el resultado **tras modificar** por el FP iguala o
//                   supera la S.
// O sea que los modificadores a la salvación NO tocan la invulnerable, nunca.
// Como las dos se comprueban con el mismo dado, basta quedarse con el umbral
// más bajo: así un «+1 a la salvación» puede hacer que a una unidad le
// convenga la armadura donde antes le convenía la invulnerable.
//
// Vive en un solo sitio porque estaba copiado en tres (tirada, daño esperado
// y tiradas necesarias) y en este archivo eso ha acabado siempre en que la
// pantalla dice una cosa y los dados hacen otra.
function salvacionEf() {
  const d = S.def;
  // modSalv positivo = suma a la tirada = salva con menos. El tope de 2 es
  // el mismo que ofrecen los chips: no hay salvaciones de 1+.
  const salvArm = Math.max(2, d.S + Math.abs(fpEf()) - (d.modSalv || 0));
  const inv = d.inv > 0 ? d.inv : 7;
  const usaInv = inv < salvArm;
  const salvEf = Math.min(inv, salvArm);
  return { salvArm, inv, usaInv, salvEf: salvEf > 6 ? 7 : salvEf };
}

const objHeridaEf = () =>
  Math.max(2, Math.min(6, objHerida(fuerzaEf(), resistenciaEf())
                          - S.atk.modHer
                          // [LANZA] (24.21): +1 a la tirada para herir si se
                          // cargó, o sea 1 menos en el resultado necesario
                          - (S.atk.lanza ? 1 : 0)));

// ── HERIDA CRÍTICA (11ª, 05.02 y [ANTI] 24.03) ──
// Por defecto solo el 6 sin modificar. [ANTI X Y+] baja ese umbral a Y para
// los blancos con la clave X; la herramienta no conoce las claves del blanco,
// así que la marcas tú al tirar.
const umbralCritHer = () => S.atk.anti || 6;

// Con qué resultado tiene éxito la tirada para herir. Una herida crítica ES
// una herida (p18, y la tabla comprueba el crítico ANTES del requerido), así
// que con [ANTI 4+] un 4 hiere aunque la tabla pida 5+. De ahí el mínimo.
const objHeridaReal = () => Math.min(objHeridaEf(), umbralCritHer());

// ── DADOS DE ATAQUE EXTRA, POR MINIATURA ──
// [ÁREA X] (24.05) y [TAJAR X] (24.06) añaden X dados por cada 5 miniaturas
// del blanco, redondeando a la baja; [FUEGO RÁPIDO X] (24.30) añade X a media
// distancia. Los tres ejemplos del reglamento dan el total **de un arma**
// («para un total de 7»), así que se suman por miniatura atacante, igual que
// el atributo A, y no una sola vez para toda la unidad.
const dadosExtra = () => {
  const a = S.atk;
  // Se cuentan las miniaturas vivas que tiene ahora el defensor. Si no hay
  // unidad elegida, `minis` es 0 y área y tajar no suman nada.
  const grupos = Math.floor((S.def.minis || 0) / 5);
  return (a.area || 0) * grupos + (a.tajar || 0) * grupos + (a.fuegoRap || 0);
};

// ── DAÑO EFECTIVO ──
// [FUSIÓN X] (24.25) «suma X al atributo D de esa arma»: D6 pasa a D6+X, y
// D6+1 con fusión 2 pasa a D6+3. Se compone la cadena y la interpreta
// RE_DADO, en vez de sumar aparte, para que la pantalla y los dados digan
// lo mismo.
function sumarDaño(d, x) {
  if (!x) return String(d);
  const m = RE_DADO.exec(String(d).toUpperCase().replace(/\s/g, ''));
  if (!m) return String((parseInt(d) || 1) + x);
  const fijo = parseInt(m[3] || '0') + x;
  return `${m[1] || ''}D${m[2]}${fijo ? (fijo > 0 ? '+' : '') + fijo : ''}`;
}
// Fusión y el modificador de la tirada se suman los dos al atributo D
const dañoEf = () => sumarDaño(S.atk.D, (S.atk.fusion || 0) + (S.atk.modD || 0));

// ═══════════════════════════════════════════════════════════
//  REPARTO DEL DAÑO
//  Cada herida sin salvar va a UNA miniatura; el exceso se pierde.
//  Las heridas mortales sueltas sí se acumulan de una miniatura a la
//  siguiente, pero las de [HERIDAS DEVASTADORAS] no: van aparte.
// ═══════════════════════════════════════════════════════════
function repartirDaño(dañosPorHerida, dañosDevast, mortales, W, minisVivas, fnp) {
  const limite = minisVivas > 0 ? minisVivas : Infinity;
  let muertas = 0, restante = W, desperdiciado = 0, fnpBloq = 0;

  function aplicar(puntos, seAcumula) {
    let p = puntos;
    while (p > 0) {
      if (muertas >= limite) { desperdiciado += p; return; }
      const usa = Math.min(p, restante);
      restante -= usa;
      p -= usa;
      if (restante === 0) { muertas++; restante = W; }
      if (!seAcumula && p > 0) { desperdiciado += p; return; }
    }
  }

  // El sin dolor se tira por cada punto de daño
  const trasFnp = puntos => {
    if (fnp <= 0) return puntos;
    let n = puntos;
    for (let i = 0; i < puntos; i++) if (d6() >= fnp) { n--; fnpBloq++; }
    return n;
  };

  // Heridas mortales sueltas (estratagemas, psíquicos). Los impactos letales
  // ya NO entran aquí: desde 11ª hieren solos y pasan por la salvación.
  for (let i = 0; i < mortales; i++) {
    if (fnp > 0 && d6() >= fnp) { fnpBloq++; continue; }
    aplicar(1, true);
  }

  for (const dv of dañosPorHerida) {
    const efectivo = trasFnp(dv);
    if (efectivo > 0) aplicar(efectivo, false);
  }

  // Y DESPUÉS el daño normal, las devastadoras (11ª, 24.10): cada herida
  // crítica inflige tantas mortales como el Daño del arma, pero puede dañar
  // 1 miniatura como mucho y lo que sobre se pierde. Por eso se reparten
  // como una herida normal (sin acumular) y no de una en una.
  for (const dv of dañosDevast || []) {
    const efectivo = trasFnp(dv);
    if (efectivo > 0) aplicar(efectivo, false);
  }

  return { muertas, heridasUltima: restante === W ? null : restante, desperdiciado, fnpBloq };
}

function nModsDef() {
  const d = S.def;
  return [d.cob, d.fnp > 0, d.hm > 0, d.modR !== 0, d.modSalv !== 0].filter(Boolean).length;
}

function nModsAtk() {
  const a = S.atk;
  const dist = a.tipo === 'dist';
  // Las situacionales cuentan igual: son lo que más fácil se olvida encendido
  const sit = [a.anti > 0, a.psiquica,
               dist && a.pesada, dist && a.fuegoRap > 0, dist && a.fusion > 0,
               dist && a.area > 0, !dist && a.lanza, !dist && a.tajar > 0,
               a.modF !== 0, a.modFP !== 0, a.modD !== 0];
  return (a.rafaga
    ? [true, a.repHer, a.devast, a.modHer !== 0, a.ignCob, ...sit]
    : [a.rep !== 'no', a.repHer, a.letal, a.devast, a.sus,
       a.modImp !== 0, a.modHer !== 0, a.ignCob, ...sit]
  ).filter(Boolean).length;
}

  if (a.letal)  autoTxt.push('impactos letales');

        <div class="psb" onclick="paso('modelos',-1)">−</div>

function pintarNecesarias() {
  const a = S.atk, d = S.def;
  const habEf = habEfectiva();

  let salvTxt, salvCls = '';
  if (usaInv) salvTxt = `${inv}+ inv.`;
  else if (salvArm > 6) { salvTxt = 'imposible'; salvCls = 'imp'; }
  else salvTxt = `${salvArm}+`;

  let html = `
    <div class="need-r"><span>Impactar</span><span class="need-v${a.rafaga ? ' auto' : ''}">${a.rafaga ? 'automático' : habEf + '+' + (hayCobertura() ? ' (cob.)' : '')}</span></div>
    <div class="need-r"><span>Herir</span><span class="need-v">${objH}+</span></div>
    <div class="need-r"><span>Salvación enemiga</span><span class="need-v ${salvCls}">${salvTxt}</span></div>`;
  if (d.fnp > 0) html += `<div class="need-r"><span>No hay dolor</span><span class="need-v">${d.fnp}+</span></div>`;

  if (d.W > 1) {
    html += `<div class="need-r"><span>Heridas por baja</span><span class="need-v">${Math.ceil(d.W / valorMedio(dañoEf()))}</span></div>`;
  }
  document.getElementById('need').innerHTML = html;
}

function pintarModificadores() {
  const a = S.atk, d = S.def, c = [];
  if (a.rafaga) c.push({ t: 'Ráfaga', raf: true });
  if (!a.rafaga) {
    if (a.rep === 'r1')   c.push({ t: 'Repetir 1s al impactar' });
    if (a.rep === 'rall') c.push({ t: 'Repetir fallos al impactar' });
    if (a.letal)  c.push({ t: 'Impactos letales' });
    if (a.sus)    c.push({ t: `Golpes sostenidos ${a.susX}` });
    if (a.modImp) c.push({ t: `${a.modImp > 0 ? '+' : ''}${a.modImp} a impactar` });
  }
  if (a.repHer) c.push({ t: 'Repetir fallos al herir' });
  if (a.devast) c.push({ t: 'Heridas devastadoras' });
  if (a.modHer) c.push({ t: `${a.modHer > 0 ? '+' : ''}${a.modHer} a herir` });
  if (a.ignCob) c.push({ t: 'Ignora cobertura' });
  if (hayCobertura()) c.push({ t: 'Cobertura: +1 a impactar' });
  if (d.hm > 0) c.push({ t: `${d.hm} heridas mortales directas` });
  document.getElementById('mods-activos').innerHTML =
    c.map(x => `<span class="mod-c${x.raf ? ' raf' : ''}">${x.t}</span>`).join('');
}

function pintarBotonLanzar() {
  const a = S.atk;
  const btn = document.getElementById('btn-lanzar');
  if (!a.arma) { btn.textContent = 'Elige un arma'; btn.disabled = true; return; }
  btn.disabled = false;
  const unidad = a.rafaga ? 'ataques' : 'dados';
  const extra = dadosExtra();
  // Con un A de dado no se puede dar el total, así que se enseña la cuenta.
  // RE_DADO en vez de la lista de antes: ahora el A podría llevar sumando.
  if (RE_DADO.test(String(a.A).toUpperCase())) {
    btn.textContent = `Lanzar ${a.A}${extra ? `+${extra}` : ''} × ${a.modelos}`;
  } else {
    btn.textContent = `Lanzar ${((parseInt(a.A) || 1) + extra) * a.modelos} ${unidad}`;
  }
}

// ═══════════════════════════════════════════════════════════
//  LANZAR
// ═══════════════════════════════════════════════════════════
function lanzar() {
  const a = S.atk, d = S.def;
  if (!a.arma) return;
  const habEf = habEfectiva();

  // ── Paso 1: impactar ──
  // Con ráfaga no hay tirada: cada ataque impacta. Sin tirada no hay 6 sin
  // modificar, así que letales y sostenidos no pueden activarse.
  const impactos = [], fallosImp = [];
  let totalDados = 0;
  const extra = dadosExtra();
  for (let m = 0; m < a.modelos; m++) {
    // Área, tajar y fuego rápido añaden dados al arma de cada miniatura
    const nA = resolverDado(a.A) + extra;
    totalDados += nA;
    if (a.rafaga) {
      for (let i = 0; i < nA; i++) impactos.push({ v: null, auto: true, letal: false });
      continue;
    }
    for (let i = 0; i < nA; i++) {
      let v = d6(), rep = false;
      if ((a.rep === 'rall' && v < habEf) || (a.rep === 'r1' && v === 1)) { v = d6(); rep = true; }
      if (v >= habEf) {
        const letal = a.letal && v === 6;
        impactos.push({ v, rep, letal });
        // [GOLPES SOSTENIDOS X] (24.36): el crítico da X impactos adicionales,
        // no uno. Los extra no son críticos, así que no activan letales.
        if (a.sus && v === 6) {
          for (let k = 0; k < (a.susX || 1); k++) {
            impactos.push({ v: 6, extra: true, letal: false });
          }
        }
      } else {
        fallosImp.push({ v, rep });
      }
    }
  }

  // ── Paso 2: herir ──
  const objH = objHeridaReal();
  const critH = umbralCritHer();
  const heridas = [], fallosHer = [];
  let letales = 0;
  for (const imp of impactos) {
    // Impactos letales (11ª, 24.23): el impacto crítico hiere automáticamente.
    // NO es una herida mortal: el defensor tira su salvación y el daño es el
    // del arma. Y como no hay tirada para herir, esa herida no puede ser
    // crítica, así que no activa devastadoras — lo dice la nota de diseño de
    // la propia regla. Se aplica siempre: renunciar es legal pero casi nunca
    // interesa, porque una herida segura vale más que la opción de un 6.
    if (imp.letal) { letales++; heridas.push({ v: null, auto: true, devast: false }); continue; }
    let v = d6(), rep = false;
    if (a.repHer && v < objH) { v = d6(); rep = true; }
    // El crítico se mira sobre el dado SIN MODIFICAR, por eso se compara `v`
    // con `critH` y no con `objH`, que ya lleva los modificadores dentro
    if (v >= objH) heridas.push({ v, rep, devast: a.devast && v >= critH });
    else fallosHer.push({ v, rep });
  }
  const devastadoras = heridas.filter(h => h.devast).length;

  // ── Paso 3: salvación ──
  const { salvArm, usaInv, salvEf } = salvacionEf();
  const normales = heridas.filter(h => !h.devast);
  const sinSalvar = [], dadosSalv = [];
  for (const h of normales) {
    const v = d6();
    const salvada = salvEf <= 6 && v >= salvEf;
    dadosSalv.push({ v, salvada });
    if (!salvada) sinSalvar.push(h);
  }

  // ── Paso 4: daño y reparto ──
  // dañoEf() es el Daño del arma con la fusión ya sumada
  const dmg = dañoEf();
  const dañosPorHerida = sinSalvar.map(() => resolverDado(dmg));
  // Cada crítica devastadora inflige tantas mortales como el Daño del arma,
  // no una sola (11ª, 24.10). Se tira el Daño por separado para cada una.
  const dañosDevast = heridas.filter(h => h.devast).map(() => resolverDado(dmg));
  const mortales = d.hm;
  const rep = repartirDaño(dañosPorHerida, dañosDevast, mortales, d.W, d.minis, d.fnp);

  ultimoResultado = {
    totalDados, impactos, fallosImp, habEf,
    heridas, fallosHer, objH, letales, devastadoras,
    dadosSalv, sinSalvar, salvEf, usaInv, salvArm,
    dañosPorHerida, dañosDevast, mortales, rep
  };

  guardarEnHistorial(rep.muertas);
  pintarResultado();
  verResultado();
}

// ═══════════════════════════════════════════════════════════
//  RENDER DEL RESULTADO
// ═══════════════════════════════════════════════════════════
function pintarResultado() {
  const r = ultimoResultado, a = S.atk, d = S.def;
  const dado = (v, cls) => `<span class="d ${cls}">${v}</span>`;

  let sub = '';
  if (r.rep.heridasUltima !== null) {
    sub = `la siguiente queda con ${r.rep.heridasUltima} herida${r.rep.heridasUltima !== 1 ? 's' : ''}`;
  } else if (r.rep.muertas > 0) {
    sub = 'sin daño repartido en la siguiente';
  }
  if (d.minis > 0 && r.rep.muertas >= d.minis) sub = 'unidad aniquilada';

  const quien = [a.unidad, a.arma].filter(Boolean).join(' · ');

  let html = '';
  if (quien) html += `<div class="hero-vs">${esc(quien)}<br>contra ${esc(d.unidad || `R${d.R} S${d.S}+`)}</div>`;

  // El deshacer vive aquí, no en el pie: el pie ya lleva cuatro botones a
  // 375 px y no cabe otro. Se queda a la vista hasta que se usa, así que
  // también sirve si te das cuenta un rato después.
  if (ultimasBajas) {
    const n = ultimasBajas.ids.length;
    html += `<div class="deshacer">
      <span>Retirada${n !== 1 ? 's' : ''} ${n} de ${esc(ultimasBajas.nombre)}</span>
      <button class="deshacer-b" onclick="deshacerBajas()">Deshacer</button>
    </div>`;
  }

  html += `
    <div class="hero${r.rep.muertas === 0 ? ' cero' : ''}">
      <div class="hero-n">${r.rep.muertas}</div>
      <div class="hero-l">miniatura${r.rep.muertas !== 1 ? 's' : ''} muerta${r.rep.muertas !== 1 ? 's' : ''}</div>
      ${sub ? `<div class="hero-s">${sub}</div>` : ''}
    </div>`;

  if (a.rafaga) {
    html += `<div class="paso">
      <div class="paso-h"><span>Impactar <span class="badge-raf">ráfaga</span></span><span class="paso-h-c">${r.totalDados} ataques</span></div>
      <div class="auto-hits">${r.impactos.length} impacto${r.impactos.length !== 1 ? 's' : ''} automático${r.impactos.length !== 1 ? 's' : ''}, sin tirada</div>
    </div>`;
  } else {
    const todosImp = [...r.impactos.map(x => ({ ...x, ok: true })), ...r.fallosImp.map(x => ({ ...x, ok: false }))]
      .sort((x, y) => y.v - x.v);
    html += `<div class="paso">
      <div class="paso-h"><span>Impactar ${r.habEf}+</span><span class="paso-h-c">${r.totalDados} → ${r.impactos.length}</span></div>
      <div class="dados">${todosImp.map(x => dado(x.extra ? '+' : x.v, x.ok ? (x.v === 6 ? 'cr' : 'ok') : '')).join('')}</div>
    </div>`;
  }

  // Las heridas automáticas de los impactos letales no tienen dado: van
  // delante y se marcan con un ✓
  const todasHer = [...r.heridas.map(x => ({ ...x, ok: true })), ...r.fallosHer.map(x => ({ ...x, ok: false }))]
    .sort((x, y) => (y.v ?? 7) - (x.v ?? 7));
  html += `<div class="paso">
    <div class="paso-h"><span>Herir ${r.objH}+</span><span class="paso-h-c">${r.impactos.length - r.letales} dado${r.impactos.length - r.letales !== 1 ? 's' : ''} → ${r.heridas.length}${r.letales ? ` (${r.letales} sin tirada)` : ''}</span></div>
    <div class="dados">${todasHer.map(x => dado(x.auto ? '✓' : x.v, x.ok ? (x.v === 6 ? 'cr' : 'ok') : '')).join('')}</div>
  </div>`;

  const nSalv = r.dadosSalv.filter(x => x.salvada).length;
  html += `<div class="paso">
    <div class="paso-h"><span>Salvación ${r.salvEf > 6 ? '—' : r.salvEf + '+'}</span><span class="paso-h-c">${r.dadosSalv.length} → ${nSalv} salvada${nSalv !== 1 ? 's' : ''}</span></div>
    <div class="dados">${r.dadosSalv.map(x => dado(x.v, x.salvada ? 'sv' : '')).join('')}</div>
  </div>`;

  const puntosDevast = r.dañosDevast.reduce((s, x) => s + x, 0);
  const totalPuntos = r.dañosPorHerida.reduce((s, x) => s + x, 0) + r.mortales + puntosDevast;
  html += `<div class="alloc">
    <div class="lbl" style="margin-bottom:6px">Reparto del daño</div>
    <div class="al-r"><span>${r.sinSalvar.length} herida${r.sinSalvar.length !== 1 ? 's' : ''} sin salvar</span><span>× Daño ${esc(dañoEf())}</span></div>
    ${r.devastadoras > 0 ? `<div class="al-r"><span>${r.devastadoras} devastadora${r.devastadoras !== 1 ? 's' : ''}</span><span>${puntosDevast} mortales · 1 miniatura cada una</span></div>` : ''}
    ${r.mortales > 0 ? `<div class="al-r"><span>Heridas mortales</span><span>${r.mortales}</span></div>` : ''}
    <div class="al-r"><span>Objetivo de ${d.W} herida${d.W !== 1 ? 's' : ''}</span><span>${totalPuntos} puntos de daño</span></div>
    ${r.rep.fnpBloq > 0 ? `<div class="al-r"><span>Bloqueado por «no hay dolor»</span><span>${r.rep.fnpBloq}</span></div>` : ''}
    <div class="al-r tot"><span>Bajas</span><span class="al-ok">${r.rep.muertas} miniatura${r.rep.muertas !== 1 ? 's' : ''}</span></div>
    ${r.rep.desperdiciado > 0 ? `<div class="al-r"><span class="al-w">Daño desperdiciado</span><span class="al-w">${r.rep.desperdiciado} punto${r.rep.desperdiciado !== 1 ? 's' : ''}</span></div>` : ''}
  </div>`;

  document.getElementById('res-cont').innerHTML = html;
  document.getElementById('btn-aplicar').classList.toggle('hide', !S.def.unitId);
}

// ═══════════════════════════════════════════════════════════
//  CAMBIO DE VISTA
//  Todas las pantallas se encienden y apagan por aquí. Antes cada función
//  escondía a mano las que conocía, y al añadir la pantalla del ejército se
//  quedó visible por debajo del lanzador. Con la lista en un solo sitio,
//  añadir una vista nueva no puede volver a dejar dos encima de la otra.
// ═══════════════════════════════════════════════════════════
// Cada pantalla dice además a dónde vuelve su ← y qué título lleva. Antes eso
// lo escribía a mano cada función, y `verEjercito` dejaba su destino puesto
// para las demás: entrando desde la pantalla del ejército, el ← del resultado
// se iba a Montar partida en vez de al lanzador. Al añadir una vista nueva,
// basta con meterla aquí.
const VISTAS = {
  'vista-partida':  { titulo: 'Partida',     atras: 'verSetup()' },
  'vista-ejercito': { titulo: 'Ejército',    atras: 'verPartida()' },
  'vista-setup':    { titulo: 'Lanzador v6', atras: null },
  'vista-res':      { titulo: 'Resultado',   atras: 'verSetup()' },
  // El historial se abre desde cualquier sitio, también sin partida montada,
  // así que su ← no puede ser fijo: sin bandos, el lanzador no sirve de nada
  'vista-hist':     { titulo: 'Historial',   atras: 'volverDeHistorial()' },
  // Misma razón que el historial: se abre desde cualquier sitio
  'vista-copia':    { titulo: 'Copia de seguridad', atras: 'volverDeHistorial()' }
};

// El ← del historial: al lanzador si hay partida, y si no a montarla.
// Pasa por empezar() y no por verSetup() a secas, igual que la entrada del
// cajón, para no caer en una pantalla de tirada sin nada elegido.
function volverDeHistorial() {
  if (P.ladoA && P.ladoB && ejercito(P.ladoA) && ejercito(P.ladoB)) empezar();
  else verPartida();
}

function mostrarVista(cual) {
  Object.keys(VISTAS).forEach(v =>
    document.getElementById(v).classList.toggle('hide', v !== cual));

  const def = VISTAS[cual] || {};
  const btn = document.getElementById('btn-atras');
  btn.style.display = def.atras ? '' : 'none';
  btn.setAttribute('onclick', def.atras || '');
  document.getElementById('hdr-titulo').textContent = def.titulo || 'Lanzador v6';
}

// Qué pantalla está a la vista ahora mismo
const vistaActual = () =>
  Object.keys(VISTAS).find(v => !document.getElementById(v).classList.contains('hide'));

function verResultado() {
  mostrarVista('vista-res');
  document.getElementById('pie').classList.remove('hide');
  document.getElementById('pie-setup').classList.add('hide');
  document.getElementById('pie-res').classList.remove('hide');
  document.getElementById('vista-res').scrollTop = 0;
}

function verSetup() {
  mostrarVista('vista-setup');
  document.getElementById('pie').classList.remove('hide');
  document.getElementById('pie-res').classList.add('hide');
  document.getElementById('pie-setup').classList.remove('hide');
  pintarTodo();
}

// ═══════════════════════════════════════════════════════════
//  PANELES — utilidades
// ═══════════════════════════════════════════════════════════
// `mantener` conserva la posición del scroll. Marcar una casilla repinta el
// panel entero, y sin esto te devolvía arriba del todo en cada toque: en un
// panel de dos pantallas, eso es más molesto que el propio scroll. Se pasa
// true desde los repintados (toggle, set, los chips) y nunca al ABRIR uno,
// que ahí sí se quiere empezar por arriba.
function abrirSheet(html, mantener = false) {
  const sheet = document.getElementById('sheet');
  const y = mantener ? sheet.scrollTop : 0;
  document.getElementById('sheet-in').innerHTML = html;
  document.getElementById('ov').classList.add('open');
  sheet.scrollTop = y;
}
function cerrarSheet() { document.getElementById('ov').classList.remove('open'); }
function cerrarSiFuera(e) { if (e.target.id === 'ov') cerrarSheet(); }

function chips(valores, actual, fn, apagado = false) {
  return `<div class="chips">${valores.map(v => {
    const val = typeof v === 'object' ? v.v : v;
    const txt = typeof v === 'object' ? v.t : v;
    const sel = String(val) === String(actual) && !apagado ? ' on' : '';
    const off = apagado ? ' off' : '';
    const click = apagado ? '' : ` onclick="${fn}('${val}')"`;
    return `<div class="ch${sel}${off}"${click}>${txt}</div>`;
  }).join('')}</div>`;
}

function stepper(id, valor, apagado = false) {
  const menos = apagado ? '' : ` onclick="paso('${id}',-1)"`;
  const mas   = apagado ? '' : ` onclick="paso('${id}',1)"`;
  return `<div class="stepr${apagado ? ' off' : ''}">
    <div class="sb"${menos}>−</div>
    <div class="sn" id="sn-${id}">${valor}</div>
    <div class="sb"${mas}>+</div>
  </div>`;
}

const LIMITES = { hab:[2,6], F:[1,20], modelos:[1,50], modImp:[-3,3], modHer:[-3,3],
                  // Modificadores al perfil solo para esta tirada
                  modF:[-6,6], modFP:[-3,3], modD:[-3,6],
                  modR:[-3,3], modSalv:[-3,3],
                  R:[1,14], S:[2,7], W:[1,30], minis:[0,60], hm:[0,20] };

// (Aquí vivía CAMPOS_PERFIL, que marcaba el perfil como «editado» al tocar
// sus atributos a mano. Desde que los paneles no editan el perfil —se hace en
// la ficha del arma o de la unidad— ningún control podía encenderlo, así que
// el chip naranja no podía aparecer. Comprobado antes de borrarlo. Para los
// apaños de un turno están modF/modFP/modD y modR/modSalv, que se ven en la
// tarjeta y mueren con la tirada.)

// Los steppers no repintan el panel, solo su propio número: así no se pierde
// el foco ni la posición al pulsar +/−. Pero los modificadores al perfil
// cambian la tira de solo lectura de arriba y la línea que resume el arma,
// así que ésos SÍ tienen que repintarlo, conservando el scroll.
const REPINTAN_PANEL = ['modF', 'modFP', 'modD', 'modImp', 'modHer',
                        'modR', 'modSalv'];

function paso(campo, delta) {
  const grupo = (campo in S.atk) ? 'atk' : 'def';
  const [min, max] = LIMITES[campo] || [0, 99];
  S[grupo][campo] = Math.max(min, Math.min(max, (S[grupo][campo] || 0) + delta));
  const el = document.getElementById('sn-' + campo);
  if (el) el.textContent = S[grupo][campo];
  pintarTodo();
  if (REPINTAN_PANEL.includes(campo)
      && document.getElementById('ov').classList.contains('open')) {
    grupo === 'atk' ? abrirSheetAtk(true) : abrirSheetDef(true);
  }
}

function set(grupo, campo, valor) {
  const num = ['hab','F','FP','modelos','modImp','modHer','R','S','inv','W','minis','fnp','hm'];
  S[grupo][campo] = num.includes(campo) ? parseInt(valor) : valor;
  // Pasar la tirada a combate apaga ráfaga e ignorar cobertura, que solo
  // existen a distancia. No basta con dejar de pintarlas: escondida y
  // encendida, ráfaga seguiría impactando sola en cuerpo a cuerpo.
  if (grupo === 'atk' && campo === 'tipo' && valor === 'cc') {
    S.atk.rafaga = false;
    S.atk.ignCob = false;
  }
  pintarTodo();
  grupo === 'atk' ? abrirSheetAtk(true) : abrirSheetDef(true);
}

function toggle(grupo, campo) {
  S[grupo][campo] = !S[grupo][campo];
  pintarTodo();
  grupo === 'atk' ? abrirSheetAtk(true) : abrirSheetDef(true);
}

// Solo queda un bloque plegable, el «Según el momento» del atacante: el
// defensor perdió su acordeón al limpiarle el panel. Antes esto era un objeto
// con una entrada por lado.
let situacionalesAbiertas = false;
function toggleSituacionales() {
  situacionalesAbiertas = !situacionalesAbiertas;
  abrirSheetAtk(true);
}

// ═══════════════════════════════════════════════════════════
//  PANEL DEL ATACANTE — ajuste manual y reglas especiales
// ═══════════════════════════════════════════════════════════
function abrirSheetAtk(mantener = false) {
  const a = S.atk;

  abrirSheet(`
    <div class="grab"></div>
    <div class="sh-t">Atacante
      ${a.unidad ? `<div class="sh-t-sub">${esc([a.unidad, a.arma].filter(Boolean).join(' · '))}</div>` : ''}
    </div>

    <!-- El perfil, de solo lectura y con lo que de verdad se va a tirar:
         lleva ya los modificadores de abajo. El arma se edita en su ficha,
         desde la pantalla del ejército, no aquí. -->
    <div class="perf-ro">
      <span>${a.tipo === 'cc' ? 'Combate' : 'Disparo'}</span>
      <span>A${esc(a.A)}</span>
      <span>${a.tipo === 'cc' ? 'HA' : 'HP'}${a.rafaga ? '—' : habEfectiva() + '+'}</span>
      <span>F${fuerzaEf()}</span>
      <span>PA${fpEf()}</span>
      <span>D${esc(dañoEf())}</span>
    </div>

    <div class="fld">
      <span class="lbl">Miniaturas que atacan</span>
      ${stepper('modelos', a.modelos)}
    </div>

    <hr class="sec-div">
    <div class="lbl" style="margin-bottom:3px">Del arma — solo para esta tirada</div>
    <div class="fld-nota" style="margin-bottom:9px">
      Vienen puestas del arma. Cambiarlas aquí no la modifica: sirve para una
      estratagema que te dé o te quite una durante una fase.
    </div>

    ${togHtml('atk','repHer','Acoplada — repetir fallos al herir', a.repHer, {})}
    ${a.tipo === 'dist' ? togHtml('atk','ignCob','Ignora cobertura', a.ignCob, {

    <div class="lbl" style="margin-bottom:3px">De esta tirada</div>
    <div class="fld-nota" style="margin-bottom:9px">

      <div class="seg${a.rafaga ? ' off' : ''}">

        <div class="seg-i${a.rep === 'r1'   && !a.rafaga ? ' on' : ''}"${a.rafaga ? '' : ` onclick="set('atk','rep','r1')"`}>Los 1</div>

}

// ── HABILIDADES QUE DEPENDEN DEL MOMENTO ──
// Las ocho de la sección 24 que no se pueden guardar en el arma porque
// cambian de una tirada a otra: si te moviste, si cargaste, a qué distancia
// está el blanco o qué claves tiene. Se marcan aquí, al tirar.
// Se filtran por tipo de ataque igual que en el panel del arma, para no
// ofrecer fuego rápido en combate ni lanza disparando.
function bloqueSituacionales() {
  const a = S.atk;
  const dist = a.tipo === 'dist';

  // Un número de 0 (apagada) a 3, para las que llevan X
  const nivel = (campo, etiq, sub, vals) => `
    <div class="fld">
      <span class="lbl">${etiq}</span>
      ${chips(vals, a[campo] || 0, `setSit_${campo}`)}
      <span class="fld-nota">${sub}</span>
    </div>`;

  // Plegado por defecto: son once controles y es lo que menos se toca, así que
  // es lo que más estorba al desplazarse. El contador del encabezado dice
  // cuántas hay encendidas, para que plegarlas no sea esconderlas.
  const n = nSituacionales();
  return `
    <hr class="sec-div" style="margin:11px 0">
    <div class="acord" onclick="toggleSituacionales()">
      <span class="acord-t">Según el momento</span>
      ${n > 0 ? `<span class="acord-n">${n}</span>` : ''}
      <span style="color:var(--muted);font-size:0.7rem">${situacionalesAbiertas ? '▲' : '▼'}</span>
    </div>

    <div class="extra${situacionalesAbiertas ? ' open' : ''}">
    <div class="fld-nota" style="margin-bottom:9px">
      Habilidades que no dependen del arma sino de la situación. Se apagan
      solas al cambiar de arma.
    </div>

    ${nivel('anti', '[Anti X Y+] — la Y',
      a.anti ? `El ${a.anti}+ sin modificar al herir es herida crítica, y una crítica siempre hiere.`
             : 'Solo si el blanco tiene la clave del arma.',
      [{v:0,t:'—'},{v:2,t:'2+'},{v:3,t:'3+'},{v:4,t:'4+'},{v:5,t:'5+'},{v:6,t:'6+'}])}

    ${togHtml('atk','psiquica','[Psíquica]', a.psiquica, {
      sub: 'Ignora los modificadores malos al impactar, incluida la cobertura' })}

    ${dist ? `
      ${togHtml('atk','pesada','[Pesada]', a.pesada, {
        sub: '+1 al impactar: no trabado, sin desplegar este turno y sin moverte más de 3"' })}
      ${nivel('fuegoRap', '[Fuego rápido X]',
        `+X dados por miniatura si el blanco está a la mitad o menos del alcance.`,
        [{v:0,t:'—'},1,2,3])}
      ${nivel('fusion', '[Fusión X]',
        `Suma X al Daño a media distancia o menos${a.fusion ? `: ahora es Daño ${esc(dañoEf())}` : ''}.`,
        [{v:0,t:'—'},1,2,3])}
      ${nivel('area', '[Área X]',
        `+X dados por cada 5 miniaturas del blanco${textoPorCinco()}`,
        [{v:0,t:'—'},1,2,3])}
    ` : `
      ${togHtml('atk','lanza','[Lanza]', a.lanza, {
        sub: '+1 al herir si la unidad cargó este turno' })}
      ${nivel('tajar', '[Tajar X]',
        `+X dados por cada 5 miniaturas del blanco, con blanco único${textoPorCinco()}`,
        [{v:0,t:'—'},1,2,3])}
    `}
    </div>`;
}

// Cuántas de las ocho situacionales están encendidas, contando solo las que
// se aplican al tipo de ataque de ahora: una [Lanza] que quedó puesta de una
// tirada de combate no cuenta si ahora estás disparando, porque no hace nada.
function nSituacionales() {
  const a = S.atk, dist = a.tipo === 'dist';
  return [a.anti > 0, a.psiquica,
          dist && a.pesada, dist && a.fuegoRap > 0,
          dist && a.fusion > 0, dist && a.area > 0,
          !dist && a.lanza, !dist && a.tajar > 0].filter(Boolean).length;
}

// Las miniaturas del blanco las pone el defensor elegido. Si no hay ninguno,
// área y tajar no suman nada y conviene decirlo en vez de callarlo.
function textoPorCinco() {
  const n = S.def.minis || 0;
  return n > 0
    ? `. Ahora mismo tiene ${n}, o sea ${Math.floor(n / 5)} por cada X.`
    : '. Sin unidad defensora elegida no suma nada.';
}

// Las que llevan un número (la X de la habilidad) comparten setter
['anti','area','tajar','fusion','fuegoRap'].forEach(campo => {
  window['setSit_' + campo] = v => {
    S.atk[campo] = parseInt(v) || 0;
    pintarTodo();
    abrirSheetAtk(true);
  };
});

// opts: { sub } línea explicativa · { off } atenuada y sin pulsar · { extra } clase adicional
function togHtml(grupo, campo, texto, activo, opts = {}) {
  const clases = ['tog',
    activo && !opts.off ? 'on' : '',
    opts.off ? 'off' : '',
    opts.extra || ''].filter(Boolean).join(' ');
  const click = opts.off ? '' : ` onclick="toggle('${grupo}','${campo}')"`;
  return `<div class="${clases}"${click}>
    <div class="tog-b">✓</div>
    <div class="tog-txt">
      <div class="tog-t">${texto}</div>
      ${opts.sub ? `<div class="tog-sub">${opts.sub}</div>` : ''}
    </div>
  </div>`;
}

// (Aquí vivían setHab, setA, setD y setFP, que editaban el perfil del arma

// (Aquí vivían setS y setInv, los editores de la salvación y la invulnerable.

// ═══════════════════════════════════════════════════════════
//  APLICAR BAJAS
// ═══════════════════════════════════════════════════════════
let bajasAAplicar = 0;

function abrirSheetBajas() {
  if (!S.def.unitId) return;
  const unidad = buscarUnidad(S.def.unitId);
  if (!unidad) { alert('Esa unidad ya no existe.'); return; }
  const vivas = contarVivas(unidad);
  bajasAAplicar = Math.min(ultimoResultado.rep.muertas, vivas);
  pintarSheetBajas(unidad, vivas);
}

function pintarSheetBajas(unidad, vivas) {
  const quedan = vivas - bajasAAplicar;
  abrirSheet(`
    <div class="grab"></div>
    <div class="sh-t">Aplicar bajas</div>

    <div class="aviso">
      Vas a retirar miniaturas de <strong>${esc(unidad.nombre)}</strong>.
      Comprueba el número antes de confirmar; si te equivocas, en la pantalla
      de resultado tendrás un «Deshacer».
    </div>

    <div class="fld">
      <span class="lbl">Miniaturas a retirar</span>
      <div class="stepr">
        <div class="sb" onclick="ajustarBajas(-1, '${unidad.id}')">−</div>
        <div class="sn">${bajasAAplicar}</div>
        <div class="sb" onclick="ajustarBajas(1, '${unidad.id}')">+</div>
      </div>
    </div>

    <div class="need">
      <div class="need-r"><span>En pie ahora</span><span class="need-v">${vivas}</span></div>
      <div class="need-r"><span>Quedarán</span><span class="need-v">${quedan}</span></div>
    </div>

    <div class="info-l">La tirada proponía ${ultimoResultado.rep.muertas} baja${ultimoResultado.rep.muertas !== 1 ? 's' : ''}.</div>

    <div class="sh-btns" style="margin-top:14px">
      <button class="b-canc" onclick="cerrarSheet()">Cancelar</button>
      <button class="b-ok${quedan === 0 ? ' danger' : ''}" onclick="confirmarBajas('${unidad.id}')">
        ${quedan === 0 ? 'Aniquilar unidad' : `Retirar ${bajasAAplicar}`}
      </button>
    </div>
  `);
}

function ajustarBajas(delta, unitId) {
  const unidad = buscarUnidad(unitId);
  if (!unidad) return;
  const vivas = contarVivas(unidad);
  bajasAAplicar = Math.max(0, Math.min(vivas, bajasAAplicar + delta));
  pintarSheetBajas(unidad, vivas);
}

function confirmarBajas(unitId) {
  if (bajasAAplicar === 0) { cerrarSheet(); return; }

  const armies = todosEjercitos();
  let unidad = null;
  Object.values(armies).forEach(ej => (ej.unidades || []).forEach(u => {
    if (u.id === unitId) unidad = u;
  }));
  if (!unidad) { alert('Esa unidad ya no existe.'); cerrarSheet(); return; }

  // Se retiran del primer grupo hacia adelante: los básicos antes que las armas pesadas
  let restantes = bajasAAplicar;
  const retiradas = [];
  for (const g of unidad.grupos || []) {
    for (const m of g.modelos || []) {
      if (restantes <= 0) break;
      if (m.vivo) { m.vivo = false; retiradas.push(m.id); restantes--; }
    }
    if (restantes <= 0) break;
  }

  // Se apunta QUÉ miniaturas se retiraron, no una copia del ejército entero:
  // así deshacer revive exactamente esas y no pisa nada que haya cambiado
  // por otro camino entre medias.
  ultimasBajas = { unitId, nombre: unidad.nombre, ids: retiradas };

  guardarJSON(LS_ARMIES, armies);
  S.def.minis = contarVivas(unidad);
  pintarTodo();
  cerrarSheet();
  if (vistaActual() === 'vista-res') pintarResultado();

  const n = bajasAAplicar;
  const btn = document.getElementById('btn-aplicar');
  btn.textContent = `${n} retirada${n !== 1 ? 's' : ''}`;
  setTimeout(() => { btn.textContent = 'Aplicar'; }, 2500);
}

// ── DESHACER LAS ÚLTIMAS BAJAS ──
// Aplicar bajas era la única acción que escribía de forma permanente en el
// ejército sin vuelta atrás: un toque de más en plena partida obligaba a
// reconstruir la unidad a mano. Se guarda la última y se puede revertir.
let ultimasBajas = null;

function deshacerBajas() {
  if (!ultimasBajas) return;
  const armies = todosEjercitos();
  let unidad = null;
  Object.values(armies).forEach(ej => (ej.unidades || []).forEach(u => {
    if (u.id === ultimasBajas.unitId) unidad = u;
  }));
  if (!unidad) {
    alert('Esa unidad ya no existe, así que no hay nada que devolver.');
    ultimasBajas = null; pintarTodo(); return;
  }

  // Puede que alguna ya no exista: si después se bajó el tamaño de la unidad,
  // `ajustarModelos()` quita primero las muertas. Se revive lo que quede.
  const porId = new Set(ultimasBajas.ids);
  let revividas = 0;
  (unidad.grupos || []).forEach(g => (g.modelos || []).forEach(m => {
    if (porId.has(m.id) && !m.vivo) { m.vivo = true; revividas++; }
  }));

  guardarJSON(LS_ARMIES, armies);
  if (S.def.unitId === unidad.id) S.def.minis = contarVivas(unidad);
  const faltaban = ultimasBajas.ids.length - revividas;
  ultimasBajas = null;
  pintarTodo();
  if (vistaActual() === 'vista-res') pintarResultado();
  if (faltaban > 0) {
    alert(`Devueltas ${revividas}. Las otras ${faltaban} ya no estaban en la unidad.`);
  }
}

// ═══════════════════════════════════════════════════════════
//  HISTORIAL
// ═══════════════════════════════════════════════════════════
function dañoEsperado() {
  const a = S.atk, d = S.def;
  // Los dados extra de área, tajar y fuego rápido van por miniatura, igual
  // que en lanzar(): si se sumaran fuera del producto saldría una tirada
  // distinta de la que hacen los dados
  const nA = (valorMedio(a.A) + dadosExtra()) * a.modelos;
  const habEf = habEfectiva();

  let pImp;
  if (a.rafaga) pImp = 1;
  else {
    pImp = Math.max(0, (7 - habEf) / 6);
    if (a.rep === 'rall')     pImp = pImp * (2 - pImp);
    else if (a.rep === 'r1')  pImp = pImp * (7 / 6);
    pImp = Math.min(1, pImp);
  }

  let impactos = nA * pImp;
  if (a.sus && !a.rafaga) impactos += (nA / 6) * (a.susX || 1);

  // Los impactos letales salen de la tirada para herir y entran ya como
  // herida, pero pasan por la salvación como cualquier otra
  let paraHerir = impactos, heridasAuto = 0;
  if (a.letal && !a.rafaga) { heridasAuto = nA / 6; paraHerir = Math.max(0, impactos - heridasAuto); }

  const objH = objHeridaReal();
  let pHer = Math.max(0, (7 - objH) / 6);
  if (a.repHer) pHer = pHer * (2 - pHer);

  let heridas = paraHerir * pHer;
  const dmg = valorMedio(dañoEf());
  // Las devastadoras salen de la secuencia normal y cada una inflige el Daño
  // del arma en mortales (24.10). Aquí se cuenta el daño bruto, igual que el
  // de las heridas normales, para que cuadre con lo que guarda el historial.
  let dañoDevast = 0;
  if (a.devast) {
    // La crítica sale con el dado sin modificar, así que su probabilidad la
    // fija el umbral de [ANTI], no el resultado necesario para herir
    const dv = paraHerir * (7 - umbralCritHer()) / 6;
    dañoDevast = dv * dmg;
    heridas = Math.max(0, heridas - dv);
  }
  heridas += heridasAuto;   // las automáticas nunca son críticas

  const { salvEf } = salvacionEf();
  const pSalv   = salvEf <= 6 ? Math.min(1, (7 - salvEf) / 6) : 0;

  // El sin dolor se tira también contra las heridas mortales directas, igual
  // que en la simulación: por eso d.hm entra antes de aplicarlo
  let daño = heridas * (1 - pSalv) * dmg + dañoDevast + d.hm;
  if (d.fnp > 0) daño *= 1 - (7 - d.fnp) / 6;

  return Math.max(0, Math.round(daño * 10) / 10);
}

// El v3 lee `ts` y `esperado` para pintar el historial: si faltan, muestra
// "Invalid Date" y 100%. Van siempre.
function guardarEnHistorial(muertas) {
  const a = S.atk, d = S.def;
  const hist = leerJSON(LS_HIST, []);
  const quien = [a.unidad, a.arma].filter(Boolean).join(' · ');
  hist.unshift({
    desc: quien ? `${quien} · ${a.modelos}m`
                : `F${fuerzaEf()} PA${fpEf()} Daño ${dañoEf()} × ${a.modelos}m`,
    modelos: a.modelos,
    // Daño que de verdad entró: el bruto menos lo que paró el «no hay dolor».
    // Antes se guardaba el bruto y `esperado` sí descontaba el sin dolor, así
    // que contra una unidad con un 5+ el historial comparaba 2,2 contra 1,5 y
    // cualquier tirada normal parecía un 50% mejor de lo que había sido.
    resultado: Math.max(0,
                 ultimoResultado.dañosPorHerida.reduce((s, x) => s + x, 0)
               + ultimoResultado.dañosDevast.reduce((s, x) => s + x, 0)
               + ultimoResultado.mortales
               - ultimoResultado.rep.fnpBloq),
    esperado: dañoEsperado(),
    muertas,
    objetivo: d.unidad || `R${d.R} S${d.S}+`,
    ts: Date.now()
  });
  guardarJSON(LS_HIST, hist.slice(0, 40));
}

//  CAJÓN LATERAL (sale por la derecha, que es donde está el ☰)
//  Hace de menú y enseña dentro los ejércitos: tocar uno abre sus unidades y
//  tocar su etiqueta cambia el bando sin salir de la pantalla de tirada.
//  Las tiradas se fueron a su propia pantalla el 04/11/2026; aquí solo queda
//  la entrada que lleva a ella.
function abrirCajon() {
  pintarCajon();
  document.getElementById('cajon-ov').classList.add('open');
}
function cerrarCajon() { document.getElementById('cajon-ov').classList.remove('open'); }
function cerrarCajonSiFuera(e) { if (e.target.id === 'cajon-ov') cerrarCajon(); }

function pintarCajon() {
  const armies = Object.values(todosEjercitos());
  const hist = leerJSON(LS_HIST, []);
  // Se marca la entrada solo si es la pantalla en la que estás: en la del
  // ejército o en el resultado no se marca ninguna
  const vista = vistaActual();
  const listo = P.ladoA && P.ladoB && P.ladoA !== P.ladoB;

  let h = '';

  // ── Ir a ──
  h += `<div class="cj-sec">Ir a</div>`;
  h += `<div class="cj-it${vista === 'vista-setup' ? ' on' : ''}" onclick="${listo ? 'irALanzador()' : ''}">
    <span class="cj-ico">⚄</span><span class="cj-n">Lanzador de dados</span>
    ${listo ? '' : '<span class="cj-cnt">falta bando</span>'}
  </div>`;
  h += `<div class="cj-it${vista === 'vista-partida' ? ' on' : ''}" onclick="irAPartida()">
    <span class="cj-ico">⚔</span><span class="cj-n">Montar partida</span>
  </div>`;
  // Las tiradas ya no se listan aquí: solo la puerta a su pantalla
  h += `<div class="cj-it${vista === 'vista-hist' ? ' on' : ''}" onclick="verHistorial()">
    <span class="cj-ico">🕐</span><span class="cj-n">Historial de tiradas</span>
    ${hist.length ? `<span class="cj-cnt">${hist.length}</span>` : ''}
  </div>`;
  h += `<div class="cj-it${vista === 'vista-copia' ? ' on' : ''}" onclick="verCopia()">
    <span class="cj-ico">💾</span><span class="cj-n">Copia de seguridad</span>
  </div>`;

  // ── Ejércitos ──
  h += `<hr class="cj-sep"><div class="cj-sec">Ejércitos</div>`;
  if (!armies.length) {
    h += `<div class="cj-vacio">Todavía no hay ninguno. Crea el tuyo y el del rival, y añádeles sus unidades.</div>`;
  } else {
    armies.forEach(ej => {
      const esA = ej.id === P.ladoA, esB = ej.id === P.ladoB;
      const cls = esA ? ' a' : (esB ? ' b' : '');
      const txtTag = esA ? 'ataca' : (esB ? 'defiende' : '— sin bando');
      const tag = `<span class="cj-tag${cls}" onclick="event.stopPropagation();rotarRolDesdeCajon('${ej.id}')">${txtTag}</span>`;
      // Toda la tarjeta lleva a las unidades. La etiqueta de bando para el
      // clic antes de que suba, que si no abriría el ejército al cambiarlo.
      h += `<div class="cj-ej${cls}" onclick="verEjercito('${ej.id}')">
        <div class="cj-ej-n">
          <span style="flex:1;min-width:0">${esc(ej.nombre)}</span>
          ${tag}<span class="cj-ej-fl">›</span>
        </div>
        <div class="cj-ej-s">${resumenEj(ej)}</div>
      </div>`;
    });
    h += `<div class="cj-vacio" style="padding-top:4px">Toca un ejército para ver sus unidades. La etiqueta de la derecha cambia su bando.</div>`;
  }
  h += `<div class="cj-add" onclick="cerrarCajon();sheetNuevoEjercito()">+ Crear ejército</div>`;

  // ── Acciones ──
  if (listo) {
    h += `<hr class="cj-sep">`;
    h += `<div class="cj-it" onclick="cerrarCajon();invertirBandos()">
      <span class="cj-ico">⇄</span><span class="cj-n">Invertir bandos</span></div>`;
  }

  document.getElementById('cajon').innerHTML = h;
}

// Escapa el texto que escriben los jugadores (nombres de ejército y de unidad)
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function irALanzador() {
  if (!(P.ladoA && P.ladoB && P.ladoA !== P.ladoB)) return;
  cerrarCajon();
  empezar();
}

function irAPartida() { cerrarCajon(); verPartida(); }

// Al rotar desde el cajón se repinta el cajón, no la pantalla de detrás
function rotarRolDesdeCajon(ejId) {
  if (P.ladoA === ejId)      { P.ladoA = null; P.ladoB = ejId; }
  else if (P.ladoB === ejId) { P.ladoB = null; }
  else if (!P.ladoA)         { P.ladoA = ejId; }
  else                       { P.ladoB = ejId; }
  if (P.ladoA && P.ladoA === P.ladoB) P.ladoB = null;
  guardarPartida();
  pintarCajon();
  // Si el lanzador está a la vista, se recoloca con los bandos nuevos
  if (document.getElementById('vista-setup').classList.contains('hide') === false) {
    autoSeleccionar('atk', P.ladoA);
    autoSeleccionar('def', P.ladoB);
    pintarTodo();
  } else if (document.getElementById('vista-partida').classList.contains('hide') === false) {
    pintarPartida();
  }
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA DE HISTORIAL
//  Antes eran cinco tiradas apretadas dentro del cajón. Aquí caben las 40
//  que se guardan, con la fecha y lo que se esperaba de cada una.
// ═══════════════════════════════════════════════════════════
function verHistorial() {
  cerrarCajon();
  mostrarVista('vista-hist');
  document.getElementById('pie').classList.add('hide');
  document.getElementById('vista-hist').scrollTop = 0;
  pintarHistorial();
}

function pintarHistorial() {
  const hist = leerJSON(LS_HIST, []);
  if (!hist.length) {
    document.getElementById('hist-cont').innerHTML =
      `<div class="vacio">Todavía no has lanzado nada.<br>Las tiradas se guardan solas y aparecen aquí.</div>`;
    return;
  }

  const fecha = ts => {
    if (!ts) return '';
    const d = new Date(ts);
    return isNaN(d) ? '' : d.toLocaleString('es-ES',
      { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  };

  let h = `<div class="pt-s" style="margin-bottom:11px">Las ${hist.length}
    últimas tiradas, de la más reciente a la más antigua.</div>`;

  hist.forEach(t => {
    // El daño esperado se enseña al lado, sin calcular un porcentaje: las
    // entradas del v3, el v4 y el v5 guardan daño bruto y el v6 lo guarda
    // neto, así que un «%» compararía peras con manzanas sin avisar.
    const esp = (typeof t.esperado === 'number' && isFinite(t.esperado))
      ? ` · esperado ${t.esperado.toFixed(1)}` : '';
    h += `<div class="h-it">
      <div class="h-t">
        <span style="flex:1;min-width:0">${esc(t.objetivo || '—')}</span>
        <span class="h-n">${t.muertas !== undefined
          ? t.muertas + ' baja' + (t.muertas !== 1 ? 's' : '')
          : t.resultado + ' daño'}</span>
      </div>
      <div class="h-s">${esc(t.desc || '')}</div>
      <div class="h-f">${esc(fecha(t.ts))}${esp}</div>
    </div>`;
  });

  h += `<div class="cj-add" style="padding:12px 0 0" onclick="limpiarHistorial()">Limpiar historial</div>`;
  document.getElementById('hist-cont').innerHTML = h;
}

// ═══════════════════════════════════════════════════════════
//  COPIA DE SEGURIDAD
//  Los ejércitos viven SOLO en el localStorage de este dispositivo. Si Safari
//  borra los datos del sitio —lo hace seguro con «Borrar historial y datos»—
//  desaparecen y no hay copia en ninguna parte. De ahí esta pantalla.
//
//  El archivo descargado es la copia que de verdad protege: queda en Archivos
//  o iCloud y sobrevive a que se limpie el navegador. El portapapeles sirve
//  para pegarlo en Notas o en el chat.
//
//  El historial de tiradas NO entra: es ruido y se rehace solo.
// ═══════════════════════════════════════════════════════════
const COPIA_APP = 'w40k-lanzador-v6';

function datosCopia() {
  return {
    app: COPIA_APP,
    version: 1,
    fecha: new Date().toISOString(),
    ejercitos: todosEjercitos(),
    partida: { ladoA: P.ladoA, ladoB: P.ladoB }
  };
}

// Qué trae un volcado, en una línea, para poder enseñarlo antes de restaurar
function resumenCopia(d) {
  const ejs = Object.values(d.ejercitos || {});
  const nU = ejs.reduce((s, e) => s + (e.unidades || []).length, 0);
  const nM = ejs.reduce((s, e) => s + (e.unidades || []).reduce(
    (t, u) => t + (u.grupos || []).reduce((q, g) => q + (g.modelos || []).length, 0), 0), 0);
  return `${ejs.length} ejército${ejs.length !== 1 ? 's' : ''} · ${nU} unidad${nU !== 1 ? 'es' : ''} · ${nM} miniaturas`;
}

// Comprueba la FORMA antes de dejar restaurar: un texto a medias o de otra
// herramienta borraría los dos ejércitos sin posible vuelta atrás.
function validarCopia(texto) {
  let d;
  try { d = JSON.parse(texto); } catch (e) { return { error: 'Eso no es un JSON válido.' }; }
  if (!d || typeof d !== 'object') return { error: 'El contenido no tiene la forma esperada.' };
  if (d.app !== COPIA_APP) return { error: 'Esta copia no es del lanzador v6.' };
  if (!d.ejercitos || typeof d.ejercitos !== 'object') return { error: 'No trae ningún ejército.' };
  for (const [id, ej] of Object.entries(d.ejercitos)) {
    if (!ej || typeof ej !== 'object') return { error: `El ejército "${id}" está mal formado.` };
    if (!Array.isArray(ej.unidades)) return { error: `"${ej.nombre || id}" no trae lista de unidades.` };
    for (const u of ej.unidades) {
      if (!u || !Array.isArray(u.grupos)) return { error: `Una unidad de "${ej.nombre || id}" no trae sus armas.` };
    }
  }
  return { d };
}

function verCopia() {
  cerrarCajon();
  mostrarVista('vista-copia');
  document.getElementById('pie').classList.add('hide');
  document.getElementById('vista-copia').scrollTop = 0;
  pintarCopia();
}

function pintarCopia(aviso) {
  const d = datosCopia();
  document.getElementById('copia-cont').innerHTML = `
    <div class="pt-s" style="margin-bottom:11px">
      Tus ejércitos viven solo en este dispositivo. Si el navegador borra los
      datos del sitio, desaparecen. Guarda el archivo de vez en cuando.
    </div>

    <div class="lbl" style="margin-bottom:3px">Lo que hay ahora</div>
    <div class="fld-nota" style="margin-bottom:9px">${esc(resumenCopia(d))}</div>

    <button class="btn-full acc" onclick="descargarCopia()">⬇ Descargar archivo</button>
    <button class="btn-full" onclick="copiarCopia()">⧉ Copiar al portapapeles</button>
    <div class="info-l" style="margin-bottom:4px">
      El archivo queda en Archivos o iCloud y aguanta aunque se limpie Safari.
    </div>
    ${aviso ? `<div class="${aviso.ok ? 'cp-ok' : 'cp-mal'}" style="margin-bottom:9px">${esc(aviso.txt)}</div>` : ''}

    <details style="margin-bottom:13px">
      <summary class="lbl" style="cursor:pointer">Ver el contenido</summary>
      <textarea class="cp-area" readonly style="margin-top:7px">${esc(JSON.stringify(d))}</textarea>
    </details>

    <hr class="sec-div">
    <div class="lbl" style="margin-bottom:3px">Restaurar</div>
    <div class="fld-nota" style="margin-bottom:9px">
      Pega aquí una copia guardada. <b>Reemplaza los ejércitos y los bandos de
      ahora</b>, no los mezcla. Antes de confirmar te dirá qué contiene.
    </div>
    <textarea class="cp-area" id="cp-pegar" placeholder="Pega aquí el contenido de la copia…"></textarea>
    <button class="btn-full" style="margin-top:7px" onclick="restaurarCopia()">Restaurar</button>`;
}

function nombreArchivoCopia() {
  const f = new Date();
  const dd = n => String(n).padStart(2, '0');
  return `ejercitos-w40k-${f.getFullYear()}-${dd(f.getMonth() + 1)}-${dd(f.getDate())}.json`;
}

function descargarCopia() {
  try {
    const txt = JSON.stringify(datosCopia(), null, 2);
    const url = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = nombreArchivoCopia();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    pintarCopia({ ok: true, txt: `Descargado ${nombreArchivoCopia()}.` });
  } catch (e) {
    pintarCopia({ ok: false, txt: 'No se ha podido descargar. Usa «Copiar al portapapeles».' });
  }
}

async function copiarCopia() {
  const txt = JSON.stringify(datosCopia());
  try {
    // En iOS esto exige que la llamada venga de un toque, y así es
    await navigator.clipboard.writeText(txt);
    pintarCopia({ ok: true, txt: 'Copiado. Pégalo en Notas, en un correo o donde lo guardes.' });
  } catch (e) {
    // Sin permiso de portapapeles queda el cuadro de texto, que es de solo
    // lectura pero se puede seleccionar y copiar a mano
    pintarCopia({ ok: false, txt: 'El navegador no ha dejado copiar. Abre «Ver el contenido» y cópialo a mano.' });
  }
}

function restaurarCopia() {
  const campo = document.getElementById('cp-pegar');
  const texto = (campo && campo.value || '').trim();
  if (!texto) { pintarCopia({ ok: false, txt: 'Pega antes el contenido de una copia.' }); return; }

  const { d, error } = validarCopia(texto);
  if (error) { pintarCopia({ ok: false, txt: error }); return; }

  const ahora = resumenCopia(datosCopia());
  if (!confirm(`La copia trae ${resumenCopia(d)}.\n\n`
             + `Sustituirá a lo que hay ahora (${ahora}), que se perderá.\n\n`
             + '¿Restaurar?')) return;

  guardarJSON(LS_ARMIES, d.ejercitos);
  const p = d.partida || {};
  P.ladoA = ejercito(p.ladoA) ? p.ladoA : null;
  P.ladoB = ejercito(p.ladoB) ? p.ladoB : null;
  guardarPartida();

  // Lo elegido para tirar apuntaba a unidades que ya no existen
  Object.assign(S.atk, { ejId: null, unitId: null, unidad: null, arma: null, grupoId: null, perfilId: null });
  Object.assign(S.def, { ejId: null, unitId: null, unidad: null });
  ultimasBajas = null;

  if (P.ladoA && P.ladoB) { autoSeleccionar('atk', P.ladoA); autoSeleccionar('def', P.ladoB); }
  pintarTodo();
  pintarCopia({ ok: true, txt: `Restaurado: ${resumenCopia(d)}.` });
}

function limpiarHistorial() {
  if (!confirm('¿Borrar todo el historial de tiradas?')) return;
  guardarJSON(LS_HIST, []);
  // Puede llamarse desde la pantalla del historial o, algún día, desde otro
  // sitio: se repinta lo que esté a la vista
  if (vistaActual() === 'vista-hist') pintarHistorial();
  pintarCajon();
}

// ═══════════════════════════════════════════════════════════
//  SINCRONIZACIÓN POR LA CLAVE w40k_sync
//  Si otra herramienta escribe esa clave, este lanzador carga la unidad que
//  nombre como atacante.
//
//  OJO: hoy NADIE la escribe. La escribía el rastreador, que se borró el
//  03/11/2026, así que este código no se ejecuta nunca. Se deja porque no
//  molesta y porque es el enganche listo si algún día vuelve a haber una
//  herramienta que quiera mandar aquí una unidad.
// ═══════════════════════════════════════════════════════════
function aplicarSync(data) {
  if (!data || !data.nombre) return;
  // Busca la unidad por nombre para conservar el vínculo con su ejército
  let encontrada = null, ejId = null;
  Object.values(todosEjercitos()).forEach(ej => (ej.unidades || []).forEach(u => {
    if (u.nombre === data.nombre && !encontrada) { encontrada = u; ejId = ej.id; }
  }));
  if (!encontrada) return;

  elegirUnidadAtk(encontrada.id, ejId, true);
  // Si el sync traía un arma concreta, intenta casarla por nombre
  if (data.perfil) {
    const w = armasDeUnidad(encontrada).find(x => x.n === data.perfil || x.n.endsWith('— ' + data.perfil));
    if (w) aplicarArma(w);
  }
  pintarTodo();
}

window.addEventListener('storage', e => {
  if (e.key === LS_SYNC) {
    try { aplicarSync(JSON.parse(e.newValue || 'null')); } catch(err) {}
  }
});

// ═══════════════════════════════════════════════════════════
//  ARRANQUE
// ═══════════════════════════════════════════════════════════
window.onload = () => {
  const p = leerJSON(LS_PARTIDA, null);
  if (p) { P.ladoA = p.ladoA; P.ladoB = p.ladoB; }

  // Si algún bando apunta a un ejército borrado, se olvida
  if (!ejercito(P.ladoA)) P.ladoA = null;
  if (!ejercito(P.ladoB)) P.ladoB = null;

  if (P.ladoA && P.ladoB) {
    autoSeleccionar('atk', P.ladoA);
    autoSeleccionar('def', P.ladoB);
    verSetup();
    // AQUÍ se leía `w40k_sync` al arrancar, y era un fallo: esa clave es
    // huérfana —la escribía el rastreador, borrado el 03/11/2026— pero sigue
    // guardada en los dispositivos que lo usaron, y nadie la borra nunca. El
    // resultado era que en CADA carga se aplicaba un mensaje viejo y te
    // cambiaba la unidad atacante sin avisar. Reproducido el 04/11/2026.
    // El escuchador de `storage` de abajo se queda: ése solo salta si otra
    // pestaña escribe la clave de verdad, que es el enganche que se quería.
  } else {
    verPartida();
  }

  // El sw.js vive en Herramientas/, un nivel por encima de esta subcarpeta.
  // Su alcance es esa carpeta hacia abajo, así que cubre también a este archivo.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
};
