<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lanzador v6">
<meta name="theme-color" content="#1a2236">
<title>Lanzador v6 — W40k</title>
<style>
:root {
  --bg: #1a2236; --surface: #212d42; --surface2: #263248;
  --accent: #2563eb; --accent2: #6baaf5;
  --text: #e8edf5; --muted: #8494ae;
  --success: #22c47a; --fail: #f56060; --warn: #e8a030;
  --border: #2d3a52; --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh; overflow: hidden;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ── CABECERA ───────────────────────────────── */
.hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; border-bottom: 3px solid var(--accent);
  flex-shrink: 0; background: var(--surface);
}
.hdr-t {
  flex: 1; color: var(--accent2); font-size: 0.7rem;
  letter-spacing: 2.5px; text-transform: uppercase;
}
.hdr-b {
  background: none; border: none; color: var(--muted);
  font-size: 1.05rem; cursor: pointer; touch-action: manipulation;
  padding: 4px 6px; line-height: 1;
}

/* ── CAJÓN LATERAL ──────────────────────────── */
/* Se abre desde la DERECHA, que es donde está el botón ☰: saliendo por la
   izquierda el panel iba al revés del gesto (cambiado el 04/11/2026).
   Dentro van los ejércitos y los sitios a los que ir. Las tiradas ya no:
   tienen su propia pantalla. */
.cajon-ov {
  display: none; position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,0.55); z-index: 120;
}
.cajon-ov.open { display: block; }
.cajon {
  position: absolute; top: 0; bottom: 0; right: 0;
  width: 86%; max-width: 360px;
  background: var(--surface); border-left: 1px solid var(--border);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
  padding-top: calc(12px + env(safe-area-inset-top));
}
.cj-sec {
  font-size: 0.58rem; color: var(--muted); letter-spacing: 1.2px;
  text-transform: uppercase; padding: 0 15px 7px;
}
.cj-it {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 15px; font-size: 0.86rem;
  cursor: pointer; touch-action: manipulation;
}
.cj-it:active { background: var(--surface2); }
/* La marca de «estás aquí» va al borde derecho: es el lado por el que se
   abre el cajón y el que queda pegado a la pantalla */
.cj-it.on {
  background: rgba(37,99,235,0.13);
  border-right: 3px solid var(--accent); padding-right: 12px;
}
.cj-ico { width: 20px; text-align: center; color: var(--accent2); flex-shrink: 0; }
.cj-n { flex: 1; }
.cj-cnt {
  font-size: 0.66rem; color: var(--muted); background: var(--bg);
  border: 1px solid var(--border); border-radius: 9px; padding: 1px 8px;
}
.cj-sep { border: none; border-top: 1px solid var(--border); margin: 9px 15px; }

.cj-ej {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 11px; margin: 0 15px 5px;
  cursor: pointer; touch-action: manipulation;
}
.cj-ej:active { background: var(--surface2); }
.cj-ej.a { border-color: rgba(37,99,235,0.55); }
.cj-ej.b { border-color: rgba(232,160,48,0.5); }
.cj-ej-n { font-size: 0.8rem; display: flex; align-items: center; gap: 7px; }
.cj-ej-s { font-size: 0.66rem; color: var(--muted); margin-top: 3px; }
.cj-ej-fl { font-size: 0.8rem; color: var(--muted); flex-shrink: 0; }
/* La etiqueta de bando es el botón que lo cambia, así que necesita área de
   toque propia y tiene que parar el clic para no abrir el ejército */
.cj-tag {
  font-size: 0.6rem; border-radius: 4px; padding: 4px 8px; flex-shrink: 0;
  cursor: pointer; touch-action: manipulation;
  background: var(--surface2); color: var(--muted);
  border: 1px solid var(--border);
}
.cj-tag:active { opacity: 0.6; }
.cj-tag.a { background: rgba(37,99,235,0.18); color: var(--accent2); border-color: rgba(37,99,235,0.45); }
.cj-tag.b { background: rgba(232,160,48,0.16); color: var(--warn); border-color: rgba(232,160,48,0.4); }
.cj-add {
  font-size: 0.74rem; color: var(--accent2); padding: 7px 15px 2px;
  cursor: pointer; touch-action: manipulation;
}
.cj-vacio { font-size: 0.72rem; color: var(--muted); padding: 2px 15px 8px; line-height: 1.5; }

/* ── PANTALLA DE COPIA DE SEGURIDAD ──────────── */
.cp-area {
  width: 100%; min-height: 150px; resize: vertical;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 10px;
  /* 16px obligatorio: por debajo, iOS hace zoom al enfocar */
  font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace;
  line-height: 1.35; -webkit-overflow-scrolling: touch;
}
.cp-ok   { color: var(--success); font-size: 0.72rem; line-height: 1.5; }
.cp-mal  { color: var(--fail);    font-size: 0.72rem; line-height: 1.5; }

/* ── PANTALLA DE HISTORIAL ───────────────────── */
/* Las tiradas vivían dentro del cajón y se sacaron a su propia pantalla el
   04/11/2026: ahí caben las 40 que se guardan, con su fecha. */
.h-it {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px; margin-bottom: 8px;
}
.h-t { display: flex; justify-content: space-between; align-items: baseline; gap: 9px; font-size: 0.82rem; }
.h-n { color: var(--success); flex-shrink: 0; }
.h-s { font-size: 0.68rem; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.h-f { font-size: 0.62rem; color: var(--muted); margin-top: 5px; }

/* ── ZONA CENTRAL ───────────────────────────── */
.scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px; display: flex; flex-direction: column; gap: 9px;
}
.wrap { width: 100%; max-width: 540px; margin: 0 auto;
        display: flex; flex-direction: column; gap: 9px; }

.lbl {
  font-size: 0.6rem; color: var(--muted);
  letter-spacing: 1.2px; text-transform: uppercase;
}

/* ── BARRA DE BANDOS ────────────────────────── */
.bandos {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 8px 9px;
}
.bando {
  flex: 1; min-width: 0; text-align: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 7px;
  cursor: pointer; touch-action: manipulation;
}
.bando:active { background: var(--surface2); }
.bando-l { font-size: 0.55rem; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }
.bando-n {
  font-size: 0.8rem; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bando.atacante { border-color: rgba(37,99,235,0.5); }
.bando.atacante .bando-n { color: var(--accent2); }
.swap {
  flex-shrink: 0; width: 44px; height: 44px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text); font-size: 1.1rem;
  cursor: pointer; touch-action: manipulation;
}
.swap:active { background: var(--accent); }

/* ── TARJETAS DE PERFIL ─────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 10px 11px;
}

.pick {
  display: flex; align-items: center; gap: 9px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 11px; margin-bottom: 6px;
  cursor: pointer; touch-action: manipulation;
  min-height: 44px;
}
.pick:active { background: var(--surface2); }
.pick.fija { cursor: default; }
.pick.fija:active { background: var(--bg); }
.pick-l { font-size: 0.6rem; color: var(--muted); letter-spacing: 1.2px;
          text-transform: uppercase; flex-shrink: 0; width: 62px; }
.pick-v { flex: 1; min-width: 0; font-size: 0.84rem;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-v.vacio { color: var(--muted); }
.pick-c { font-size: 0.8rem; color: var(--muted); flex-shrink: 0; }

.pick-step { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.psb {
  width: 38px; height: 34px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 1.05rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation;
}
.psb:active { background: var(--accent); }
.psn { min-width: 30px; text-align: center; font-size: 1.05rem; }

.stats-g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 3px; }
.st {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 3px; text-align: center;
}
.st.hl { border-color: rgba(232,160,48,0.5); }
.st-v { font-size: 1.15rem; line-height: 1; }
.st.hl .st-v { color: var(--warn); }
.st-l { font-size: 0.6rem; color: var(--muted); margin-top: 3px; }
.card-pie { font-size: 0.66rem; color: var(--muted); margin-top: 7px; line-height: 1.5; }

.ajst {
  display: flex; align-items: center; gap: 7px; width: 100%;
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--muted); padding: 9px 11px; margin-top: 7px;
  font-size: 0.74rem; font-family: inherit;
  cursor: pointer; touch-action: manipulation; min-height: 38px;
}
.ajst:active { background: var(--surface2); }
.ajst.hay { border-color: rgba(37,99,235,0.45); color: var(--accent2); }
.ajst-t { flex: 1; text-align: left; }
.ajst-n {
  background: rgba(37,99,235,0.16); border: 1px solid rgba(37,99,235,0.4);
  border-radius: 5px; padding: 1px 7px; font-size: 0.66rem; color: var(--accent2);
}

.chip-p {
  background: rgba(37,99,235,0.16); border: 1px solid rgba(37,99,235,0.4);
  border-radius: 5px; padding: 2px 7px; font-size: 0.66rem;
  color: var(--accent2); flex-shrink: 0;
}
.vs { text-align: center; font-size: 0.62rem; color: var(--muted); letter-spacing: 2px; }

/* ── LISTAS DE SELECCIÓN ────────────────────── */
.grp-t {
  font-size: 0.6rem; color: var(--muted); letter-spacing: 1.2px;
  text-transform: uppercase; margin: 13px 0 6px;
}
.grp-t:first-child { margin-top: 0; }
.grp-t.act { color: var(--accent2); }
.uitem {
  display: flex; align-items: center; gap: 9px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 11px; margin-bottom: 5px;
  cursor: pointer; touch-action: manipulation; min-height: 46px;
}
.uitem:active { background: var(--surface2); }
.uitem.on { border-color: var(--accent); background: rgba(37,99,235,0.1); }
.uitem.muerta { opacity: 0.45; }
.uitem-txt { flex: 1; min-width: 0; }
.uitem-n { font-size: 0.84rem; }
.uitem-s { font-size: 0.66rem; color: var(--muted); margin-top: 2px; }
.uitem-tag {
  font-size: 0.62rem; color: var(--muted); flex-shrink: 0;
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px;
}
.uitem-tag.dist { color: var(--accent2); border-color: rgba(107,170,245,0.4); }
.uitem-tag.cc   { color: var(--warn);   border-color: rgba(232,160,48,0.4); }

/* ── PANTALLA DE PARTIDA ────────────────────── */
.pt-h { font-size: 0.95rem; margin-bottom: 4px; }
.pt-s { font-size: 0.74rem; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
.ejcard {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 12px; margin-bottom: 6px;
  cursor: pointer; touch-action: manipulation; min-height: 52px;
}
.ejcard:active { background: var(--surface2); }
.ejcard.a { border-color: rgba(37,99,235,0.6); }
.ejcard.b { border-color: rgba(232,160,48,0.5); }
.ejcard-txt { flex: 1; min-width: 0; }
.ejcard-n { font-size: 0.88rem; }
.ejcard-s { font-size: 0.66rem; color: var(--muted); margin-top: 2px; }
.ejcard-rol {
  font-size: 0.62rem; flex-shrink: 0; border-radius: 5px; padding: 3px 8px;
  border: 1px solid var(--border); color: var(--muted);
}
.ejcard.a .ejcard-rol { color: var(--accent2); border-color: rgba(37,99,235,0.5); }
.ejcard.b .ejcard-rol { color: var(--warn); border-color: rgba(232,160,48,0.5); }

/* ── PANTALLA DE UN EJÉRCITO ────────────────── */
/* Lista de unidades que se despliegan en el sitio con su ficha. */
.ej-cab {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 13px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.ej-cab.a { border-color: rgba(37,99,235,0.5); }
.ej-cab.b { border-color: rgba(232,160,48,0.45); }
.ej-cab-n { font-size: 0.95rem; }
.ej-cab-s { font-size: 0.68rem; color: var(--muted); margin-top: 3px; }

.uni { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 7px; overflow: hidden; }
.uni.open { border-color: rgba(37,99,235,0.5); }
.uni-top {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  cursor: pointer; touch-action: manipulation;
}
.uni-top:active { background: var(--surface2); }
.uni-n { flex: 1; font-size: 0.85rem; }
.uni-x { font-size: 0.78rem; color: var(--muted); }
.uni-ch { font-size: 0.62rem; color: var(--muted); }
.uni-sub { font-size: 0.68rem; color: var(--muted); padding: 0 12px 10px; margin-top: -5px; }

.uni-det { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.uni-perf { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; }
.up { text-align: center; }
.up-l { font-size: 0.56rem; color: var(--muted); margin-bottom: 3px; letter-spacing: 0.5px; }
.up-v {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 1px; font-size: 0.82rem;
}
.uni-lbl { font-size: 0.58rem; color: var(--accent2); letter-spacing: 1.2px; text-transform: uppercase; }
.uni-arma {
  display: flex; align-items: center; gap: 9px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 10px;
  cursor: pointer; touch-action: manipulation;
}
.uni-arma:active { border-color: var(--accent); }
.uni-arma-t { flex: 1; min-width: 0; }
.uni-arma-n { font-size: 0.76rem; }
.uni-arma-s { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.uni-lap { font-size: 0.82rem; color: var(--muted); flex-shrink: 0; }
.uni-btns { display: flex; gap: 6px; }
.uni-bt {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); padding: 9px; font-size: 0.72rem;
  text-align: center; cursor: pointer; touch-action: manipulation;
}
.uni-bt.del { background: none; border-color: rgba(245,96,96,0.3); color: var(--fail); }
.uni-add {
  border: 1px dashed rgba(37,99,235,0.42); border-radius: 7px;
  padding: 8px; text-align: center; font-size: 0.72rem; color: var(--accent2);
  cursor: pointer; touch-action: manipulation;
}

.btn-full {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); padding: 13px;
  font-size: 0.82rem; font-family: inherit; margin-top: 7px;
  cursor: pointer; touch-action: manipulation;
}
.btn-full:active { background: var(--accent); }
.btn-full.dashed { border-style: dashed; color: var(--muted); background: none; }
.btn-full.acc { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── FORMULARIOS (alta rápida) ──────────────── */
/* 16px en los inputs: por debajo, iOS hace zoom al enfocarlos */
.form-i {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 11px;
  font-size: 16px; font-family: inherit;
}
.form-i:focus { outline: none; border-color: var(--accent); }
.form-row { display: flex; gap: 7px; }
.form-row > * { flex: 1; min-width: 0; }
.sec-div {
  border: none; border-top: 1px solid var(--border);
  margin: 15px 0 13px;
}

/* ── TIRADAS NECESARIAS ─────────────────────── */
.need {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; overflow: hidden;
}
.need-r {
  display: flex; justify-content: space-between;
  padding: 7px 12px; border-bottom: 1px solid var(--border);
  font-size: 0.76rem;
}
.need-r:last-child { border-bottom: none; }
.need-v { color: var(--accent2); }
.need-v.imp { color: var(--fail); }

/* ── PIE / BOTÓN LANZAR ─────────────────────── */
.pie {
  flex-shrink: 0; padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border); background: var(--surface);
}
.pie-in { max-width: 540px; margin: 0 auto; display: flex; gap: 8px; }
.btn-l {
  flex: 1; background: var(--accent); border: none; border-radius: 11px;
  color: #fff; padding: 15px; font-size: 0.95rem; font-weight: 500;
  cursor: pointer; touch-action: manipulation;
}
.btn-l:active { opacity: 0.85; }
.btn-l:disabled { background: var(--surface2); color: var(--muted); }
.btn-s {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 11px; color: var(--text); padding: 15px 17px;
  font-size: 0.9rem; cursor: pointer; touch-action: manipulation;
}
.btn-s:active { background: var(--accent); }
.btn-s.acc { border-color: var(--accent); color: var(--accent2); }

/* ── RESULTADO ──────────────────────────────── */
.hero {
  background: var(--surface); border: 1px solid rgba(34,196,122,0.4);
  border-radius: 11px; padding: 16px 12px; text-align: center;
}
.hero.cero { border-color: var(--border); }

/* Aviso de bajas aplicadas con su deshacer. Va en el cuerpo del resultado
   porque el pie ya lleva cuatro botones y a 375 px no cabe un quinto. */
.deshacer {
  display: flex; align-items: center; gap: 9px;
  background: rgba(232,160,48,0.1); border: 1px solid rgba(232,160,48,0.35);
  border-radius: 9px; padding: 9px 11px; margin-bottom: 10px;
  font-size: 0.72rem; color: var(--warn);
}
.deshacer span { flex: 1; min-width: 0; }
.deshacer-b {
  flex-shrink: 0; background: none; border: 1px solid rgba(232,160,48,0.5);
  border-radius: 7px; color: var(--warn); padding: 0 14px;
  /* 40px de alto: a 31 se quedaba corto para un dedo en el iPad */
  min-height: 40px;
  font-size: 0.72rem; font-family: inherit;
  cursor: pointer; touch-action: manipulation;
}
.deshacer-b:active { background: rgba(232,160,48,0.2); }
.hero-n { font-size: 2.3rem; line-height: 1; color: var(--success); }
.hero.cero .hero-n { color: var(--muted); }
.hero-l { font-size: 0.85rem; margin-top: 5px; }
.hero-s { font-size: 0.68rem; color: var(--muted); margin-top: 5px; }
.hero-vs { font-size: 0.7rem; color: var(--muted); margin-bottom: 9px; line-height: 1.5; }

.paso {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px;
}
.paso-h {
  display: flex; justify-content: space-between;
  font-size: 0.74rem; margin-bottom: 6px;
}
.paso-h-c { color: var(--muted); }
.dados { display: flex; flex-wrap: wrap; gap: 3px; }
.d {
  width: 21px; height: 21px; border-radius: 4px;
  font-size: 0.68rem; display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 1px solid var(--border); color: var(--muted);
}
.d.ok { background: rgba(34,196,122,0.15); border-color: rgba(34,196,122,0.5); color: var(--success); }
.d.cr { background: rgba(232,160,48,0.18); border-color: var(--warn); color: var(--warn); }
.d.sv { background: rgba(107,170,245,0.15); border-color: rgba(107,170,245,0.5); color: var(--accent2); }

.alloc {
  background: var(--surface); border: 1px solid rgba(232,160,48,0.35);
  border-radius: 11px; padding: 10px 11px;
}
.al-r { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 3px 0; }
.al-r.tot { border-top: 1px solid var(--border); margin-top: 5px; padding-top: 6px; }
.al-ok { color: var(--success); }
.al-w  { color: var(--warn); }

.mods { display: flex; flex-wrap: wrap; gap: 4px; }
.mod-c {
  background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.25);
  border-radius: 5px; padding: 3px 7px; font-size: 0.65rem; color: var(--accent2);
}

/* ── PANEL INFERIOR (SHEET) ─────────────────── */
.ov {
  display: none; position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,0.6); z-index: 100;
  align-items: flex-end;
}
.ov.open { display: flex; }
.sheet {
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0; padding: 12px;
  width: 100%;
  /* El `vh` es obligatorio como respaldo: `dvh` solo existe desde iOS 15.4.
     Con la barra de Safari desplegada, 88vh se sale de lo que se ve y el
     botón «Listo» queda debajo del borde; `dvh` mide lo que hay de verdad. */
  max-height: 88vh; max-height: 88dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
}
.sheet-in { max-width: 540px; margin: 0 auto; }
.grab { width: 34px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 11px; }
.sh-t { font-size: 0.82rem; font-weight: 500; margin-bottom: 12px; }
.sh-t-sub { font-size: 0.68rem; color: var(--muted); font-weight: 400; margin-top: 3px; }

.fld { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }

/* El perfil del arma dentro del panel del atacante: SOLO LECTURA. Enseña lo
   que se va a tirar de verdad, con los modificadores ya aplicados. El arma
   se edita en su ficha, desde la pantalla del ejército. */
.perf-ro {
  display: flex; flex-wrap: wrap; gap: 5px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 10px; margin-bottom: 12px;
  font-size: 0.72rem; color: var(--muted);
}
.perf-ro span { white-space: nowrap; }
.perf-ro span + span::before { content: '·'; margin-right: 5px; opacity: 0.5; }

.seg { display: flex; gap: 4px; background: var(--bg); border-radius: 8px; padding: 3px; }
.seg-i {
  flex: 1; padding: 9px 4px; text-align: center; font-size: 0.76rem;
  border-radius: 6px; color: var(--muted);
  cursor: pointer; touch-action: manipulation;
}
.seg-i.on { background: var(--accent); color: #fff; }

.stepr {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px;
}
.sb {
  width: 42px; height: 36px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation; flex-shrink: 0;
}
.sb:active { background: var(--accent); }
.sn { flex: 1; text-align: center; font-size: 1.15rem; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ch {
  min-width: 42px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 9px 8px; text-align: center;
  font-size: 0.76rem; color: var(--muted);
  cursor: pointer; touch-action: manipulation; flex: 1;
}
.ch.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.tog {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 11px; margin-bottom: 5px;
  cursor: pointer; touch-action: manipulation;
}
.tog.on { border-color: var(--accent); background: rgba(37,99,235,0.08); }
.tog-b {
  width: 17px; height: 17px; border-radius: 4px;
  border: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: transparent;
}
.tog.on .tog-b { background: var(--accent); border-color: var(--accent); color: #fff; }
.tog-txt { flex: 1; }
.tog-t { font-size: 0.78rem; }
.tog-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.tog.raf.on { border-color: var(--warn); background: rgba(232,160,48,0.09); }
.tog.raf.on .tog-b { background: var(--warn); border-color: var(--warn); color: var(--bg); }

.tog.off { opacity: 0.4; cursor: default; }
.ch.off  { opacity: 0.35; cursor: default; }
.seg.off { opacity: 0.4; }
.seg.off .seg-i { cursor: default; }
.stepr.off { opacity: 0.4; }
.stepr.off .sb { cursor: default; }
.fld-nota { font-size: 0.65rem; color: var(--muted); line-height: 1.4; }

/* ── FILA DE ATRIBUTOS DEL ARMA ──────────────── */
/* A, HA/HP, F, FP y D en una sola línea, cada uno un desplegable. En iOS un
   <select> abre la rueda nativa, que con una mano va mejor que una fila de
   chips, y las cinco columnas caben a 375 px sin desbordar. */
.atr-row { display: flex; gap: 6px; }
.atr { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.atr-l {
  font-size: 0.58rem; color: var(--muted); letter-spacing: 0.8px;
  text-transform: uppercase; text-align: center;
}
.atr-s {
  width: 100%; -webkit-appearance: none; appearance: none;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text);
  /* 16px es obligatorio: por debajo, iOS hace zoom al enfocar el campo */
  font-size: 16px; padding: 10px 2px;
  text-align: center; text-align-last: center;
  cursor: pointer; touch-action: manipulation;
}
.atr-s:disabled { opacity: 0.35; cursor: default; }

.auto-hits {
  background: rgba(232,160,48,0.1); border: 1px solid rgba(232,160,48,0.3);
  border-radius: 6px; padding: 9px; text-align: center;
  font-size: 0.74rem; color: var(--warn);
}
.badge-raf {
  background: rgba(232,160,48,0.16); border: 1px solid rgba(232,160,48,0.4);
  border-radius: 5px; padding: 1px 6px; font-size: 0.62rem; color: var(--warn);
}
.mod-c.raf { background: rgba(232,160,48,0.1); border-color: rgba(232,160,48,0.3); color: var(--warn); }
.need-v.auto { color: var(--warn); }

.acord {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 11px; margin-bottom: 11px;
  cursor: pointer; touch-action: manipulation;
}
.acord-t { flex: 1; font-size: 0.8rem; }
.acord-n {
  background: rgba(37,99,235,0.16); border: 1px solid rgba(37,99,235,0.4);
  border-radius: 5px; padding: 1px 7px; font-size: 0.66rem; color: var(--accent2);
}
.extra { display: none; }
.extra.open { display: block; }

.sh-btns { display: flex; gap: 8px; margin-top: 4px; }
.b-canc {
  flex: 1; background: none; border: 1px solid var(--border);
  border-radius: 9px; color: var(--muted); padding: 13px;
  font-size: 0.82rem; font-family: inherit;
  cursor: pointer; touch-action: manipulation;
}
.b-ok {
  flex: 2; background: var(--accent); border: none;
  border-radius: 9px; color: #fff; padding: 13px;
  font-size: 0.82rem; font-weight: 500; font-family: inherit;
  cursor: pointer; touch-action: manipulation;
}
.b-ok.danger { background: var(--fail); }

.aviso {
  background: rgba(232,160,48,0.1); border: 1px solid rgba(232,160,48,0.3);
  border-radius: 8px; padding: 9px 11px; font-size: 0.72rem;
  color: var(--warn); line-height: 1.5; margin-bottom: 11px;
}
.nota-u {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 11px; font-size: 0.7rem;
  color: var(--muted); line-height: 1.5; margin-bottom: 11px;
}
.info-l { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 7px; line-height: 1.5; }

/* ── HISTORIAL ──────────────────────────────── */
/* (Aquí estaban .h-item, .h-top y .h-sub, de cuando el historial se pintaba
   de otra forma. La pantalla de historial usa .h-it, .h-t, .h-s y .h-f, que
   se parecen tanto en el nombre que convenía no dejar las dos parejas.) */
.h-n { color: var(--success); font-weight: 500; }

.vacio { text-align: center; color: var(--muted); font-size: 0.76rem; padding: 22px 10px; }
.hide { display: none; }
</style>
</head>
<body>

<div class="hdr">
  <!-- El destino y el título los pone mostrarVista() desde la tabla VISTAS -->
  <button class="hdr-b" id="btn-atras" style="display:none">←</button>
  <span class="hdr-t" id="hdr-titulo">Lanzador v6</span>
  <button class="hdr-b" onclick="abrirCajon()">☰</button>
</div>

<!-- ── CAJÓN LATERAL ── -->
<div class="cajon-ov" id="cajon-ov" onclick="cerrarCajonSiFuera(event)">
  <div class="cajon" id="cajon"></div>
</div>

<!-- ── VISTA: MONTAR PARTIDA ── -->
<div class="scroll hide" id="vista-partida">
  <div class="wrap" id="partida-cont"></div>
</div>

<!-- ── VISTA: UN EJÉRCITO Y SUS UNIDADES ── -->
<div class="scroll hide" id="vista-ejercito">
  <div class="wrap" id="ejercito-cont"></div>
</div>

<!-- ── VISTA DE CONFIGURACIÓN ── -->
<div class="scroll hide" id="vista-setup">
  <div class="wrap">
    <div class="bandos" id="bandos"></div>

    <div class="lbl">Atacante</div>
    <div class="card" id="card-atk"></div>

    <div class="vs">contra</div>

    <div class="lbl">Defensor</div>
    <div class="card" id="card-def"></div>

    <div class="need" id="need"></div>
    <div class="mods" id="mods-activos"></div>
  </div>
</div>

<!-- ── VISTA DE RESULTADO ── -->
<div class="scroll hide" id="vista-res">
  <div class="wrap" id="res-cont"></div>
</div>

<!-- ── VISTA: COPIA DE SEGURIDAD ── -->
<div class="scroll hide" id="vista-copia">
  <div class="wrap" id="copia-cont"></div>
</div>

<!-- ── VISTA: HISTORIAL ── -->
<div class="scroll hide" id="vista-hist">
  <div class="wrap" id="hist-cont"></div>
</div>

<!-- ── PIE ── -->
<div class="pie hide" id="pie">
  <div class="pie-in" id="pie-setup">
    <button class="btn-l" onclick="lanzar()" id="btn-lanzar">Lanzar</button>
  </div>
  <!-- Las tres secundarias a la izquierda y la principal a la derecha, que es
       donde cae el pulgar. «Editar» no decía que te devolvía al lanzador y
       «Repetir» tiraba lo mismo: desde el resultado, lo que suele hacer falta
       es otra tirada distinta, o que conteste el que acaba de recibir. -->
  <div class="pie-in hide" id="pie-res">
    <button class="btn-s acc hide" id="btn-aplicar" onclick="abrirSheetBajas()">Aplicar</button>
    <button class="btn-s" onclick="invertirYLanzar()" title="Invertir bandos">⇄</button>
    <button class="btn-s" onclick="lanzar()">Repetir</button>
    <button class="btn-l" onclick="verSetup()">Nueva tirada</button>
  </div>
</div>

<!-- ── PANEL INFERIOR ── -->
<div class="ov" id="ov" onclick="cerrarSiFuera(event)">
  <div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  ALMACENAMIENTO
//  Las cuatro primeras claves son compartidas con el rastreador y con los
//  lanzadores v3/v4/v5. LS_PARTIDA es propia del v6.
// ═══════════════════════════════════════════════════════════
const LS_ARMIES  = 'w40k_armies_v2';
const LS_HIST    = 'w40k_roll_history';
const LS_SYNC    = 'w40k_sync';
const LS_PARTIDA = 'w40k_partida_v1';

const leerJSON = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch(e) { return def; } };
const guardarJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ═══════════════════════════════════════════════════════════
//  SIN DATOS PRECARGADOS
//  Este lanzador no trae ningún perfil de ninguna unidad. Cada jugador da
//  de alta las suyas con sus armas, y eso es lo único que existe.
//
//  Es deliberado: las versiones anteriores llevaban un catálogo propio que
//  se quedó desactualizado y acabó dando salvaciones y perfiles erróneos
//  sin que nadie se diera cuenta. Si no hay datos, no pueden estar mal.
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════════════════
// P.ladoA es siempre el bando atacante; invertir bandos los intercambia.
const P = { ladoA: null, ladoB: null };

const S = {
  atk: { ejId: null, unitId: null, grupoId: null, perfilId: null,
         unidad: null, arma: null,
         tipo: 'dist', hab: 3,
         A: '2', F: 4, FP: 0, D: '1', modelos: 1,
         rafaga: false, ignCob: false,
         // susX es la X de [GOLPES SOSTENIDOS X] (24.36): cuántos impactos
         // extra da cada 6, no siempre uno
         rep: 'no', repHer: false, letal: false, devast: false, sus: false, susX: 1,
         modImp: 0, modHer: 0,
         // Modificadores al perfil, solo para esta tirada. Existen para no
         // tener que EDITAR el arma cuando una estratagema sube la Fuerza una
         // fase: el arma dejaría de ser lo que dice el codex y el apaño se
         // arrastraría hasta cambiar de arma. Éstos mueren con la tirada.
         modF: 0, modFP: 0, modD: 0,
         // ── Habilidades que dependen del momento (sección 24) ──
         // No se guardan en el arma: cambian de una tirada a otra según si te
         // moviste, si cargaste o a qué distancia estás. 0 o false = apagada.
         anti: 0,          // [ANTI X Y+] 24.03 — la Y: herida crítica con Y+
         area: 0,          // [ÁREA X] 24.05 — X dados por cada 5 del blanco
         tajar: 0,         // [TAJAR X] 24.06 — igual, con blanco único
         pesada: false,    // [PESADA] 24.16 — +1 al impactar si no te moviste
         lanza: false,     // [LANZA] 24.21 — +1 al herir si cargaste
         fusion: 0,        // [FUSIÓN X] 24.25 — +X al Daño a media distancia
         fuegoRap: 0,      // [FUEGO RÁPIDO X] 24.30 — +X dados a media distancia
         psiquica: false },// [PSÍQUICA] 24.29 — ignora modificadores al impactar
  def: { ejId: null, unitId: null, unidad: null,
         R: 4, S: 3, inv: 0, W: 1,
         // `fnp` es «No hay dolor» (24.12), una habilidad de la unidad: se
         // carga de ella al elegirla y aquí solo se cambia para esta tirada
         minis: 0, fnp: 0, cob: false, hm: 0,
         // Modificadores solo para esta tirada, como los del atacante
         modR: 0, modSalv: 0 }
};

let ultimoResultado = null;

// ═══════════════════════════════════════════════════════════
//  ACCESO A LOS EJÉRCITOS
// ═══════════════════════════════════════════════════════════
const todosEjercitos = () => leerJSON(LS_ARMIES, {});
const ejercito = id => todosEjercitos()[id] || null;

function buscarUnidad(unitId) {
  let encontrada = null;
  Object.values(todosEjercitos()).forEach(ej => (ej.unidades || []).forEach(u => {
    if (u.id === unitId) encontrada = u;
  }));
  return encontrada;
}

function contarVivas(unidad) {
  return (unidad.grupos || []).reduce((s, g) => s + (g.modelos || []).filter(m => m.vivo).length, 0);
}

function contarMinis(ej) {
  return (ej.unidades || []).reduce((s, u) => s + contarVivas(u), 0);
}

// Subtítulo de un ejército, igual en la lista, en el cajón y en su pantalla
function resumenEj(ej) {
  const n = (ej.unidades || []).length;
  return `${esc(ej.faccion || 'Sin facción')} · ${n} unidad${n !== 1 ? 'es' : ''} · ${contarMinis(ej)} miniaturas vivas`;
}

// Aplana los grupos de una unidad en una lista de armas elegibles. Un grupo
// con varios perfiles da un arma por perfil; `tipo` y `hab` salen del perfil
// si los trae (extensión del v6) y si no, del grupo.
function armasDeUnidad(u) {
  const out = [];
  (u.grupos || []).forEach(g => {
    const vivos = (g.modelos || []).filter(m => m.vivo).length;
    if (g.perfiles && g.perfiles.length) {
      // Si el grupo se llama como la unidad, el prefijo solo roba ancho
      const pref = g.nombre === u.nombre ? '' : `${g.nombre} — `;
      g.perfiles.forEach(p => out.push({
        grupoId: g.id, perfilId: p.id,
        n: `${pref}${p.nombre}`,
        tipo: p.tipo || g.tipo, hab: p.hab || g.hab,
        A: String(p.A), F: p.F, FP: p.FP, D: String(p.D),
        minis: vivos, auto: { ...(p.auto || {}), rafaga: !!p.rafaga }
      }));
    } else {
      out.push({
        grupoId: g.id, perfilId: null, n: g.nombre,
        tipo: g.tipo, hab: g.hab,
        A: String(g.A), F: g.F, FP: g.FP, D: String(g.D),
        minis: vivos, auto: { ...(g.auto || {}), rafaga: !!g.rafaga }
      });
    }
  });
  return out;
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA: MONTAR PARTIDA
// ═══════════════════════════════════════════════════════════
function verPartida() {
  mostrarVista('vista-partida');
  document.getElementById('pie').classList.add('hide');
  // Única pantalla que retoca su ←: sin los dos bandos no hay tirada a la
  // que volver, así que se esconde
  if (!(P.ladoA && P.ladoB && ejercito(P.ladoA) && ejercito(P.ladoB))) {
    document.getElementById('btn-atras').style.display = 'none';
  }
  pintarPartida();
}

function pintarPartida() {
  const armies = Object.values(todosEjercitos());
  let h = `<div class="pt-h">Los dos bandos</div>
    <div class="pt-s">Elige qué ejército ataca y cuál defiende. Puedes invertirlos
    en cualquier momento desde la pantalla de tirada.</div>`;

  if (!armies.length) {
    h += `<div class="nota-u">Todavía no hay ningún ejército. Crea el tuyo y el del rival, y dale a cada uno sus unidades con sus armas.</div>`;
  }

  armies.forEach(ej => {
    const rol = ej.id === P.ladoA ? 'Atacante' : (ej.id === P.ladoB ? 'Defensor' : '');
    const cls = ej.id === P.ladoA ? ' a' : (ej.id === P.ladoB ? ' b' : '');
    h += `<div class="ejcard${cls}" onclick="verEjercito('${ej.id}')">
      <div class="ejcard-txt">
        <div class="ejcard-n">${esc(ej.nombre)}</div>
        <div class="ejcard-s">${resumenEj(ej)}</div>
      </div>
      ${rol ? `<span class="ejcard-rol">${rol}</span>` : '<span class="ejcard-rol">Sin bando</span>'}
    </div>`;
  });

  h += `<button class="btn-full dashed" onclick="sheetNuevoEjercito()">+ Crear ejército</button>`;

  const listo = P.ladoA && P.ladoB && P.ladoA !== P.ladoB;
  h += `<button class="btn-full acc" style="margin-top:14px" ${listo ? 'onclick="empezar()"' : 'disabled'}>
    ${listo ? 'Empezar a tirar' : 'Elige los dos bandos'}
  </button>`;

  h += `<div class="info-l">Toca un ejército para ver y editar sus unidades. El bando se cambia desde el menú ☰.</div>`;

  document.getElementById('partida-cont').innerHTML = h;
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA: UN EJÉRCITO Y SUS UNIDADES
//  Las unidades se despliegan en el sitio con su ficha. Desde aquí se
//  editan, se les añaden armas y se borran. El bando NO se cambia aquí:
//  eso se hace desde el cajón, para no tocarlo sin querer en plena partida.
// ═══════════════════════════════════════════════════════════
let ejAbierto = null;              // ejército que se está viendo
const unidadesAbiertas = new Set(); // unidades desplegadas

function verEjercito(ejId) {
  ejAbierto = ejId;
  unidadesAbiertas.clear();
  cerrarCajon();
  mostrarVista('vista-ejercito');
  document.getElementById('pie').classList.add('hide');
  pintarEjercito();
}

function pintarEjercito() {
  const ej = ejercito(ejAbierto);
  if (!ej) { verPartida(); return; }

  const esA = ej.id === P.ladoA, esB = ej.id === P.ladoB;
  const rol = esA ? 'ataca' : (esB ? 'defiende' : 'sin bando');
  const cls = esA ? ' a' : (esB ? ' b' : '');

  let h = `<div class="ej-cab${cls}">
    <div style="flex:1;min-width:0">
      <div class="ej-cab-n">${esc(ej.nombre)}</div>
      <div class="ej-cab-s">${resumenEj(ej)}</div>
    </div>
    <span class="ejcard-rol">${rol}</span>
  </div>`;

  // Sin esto no había forma de volver a poner las miniaturas en pie: el apaño
  // era bajar el contador de cada unidad y volver a subirlo, arma por arma.
  // El botón solo sale si hay alguna caída, para no ocupar sitio en vano.
  const caidas = contarCaidas(ej);
  if (caidas > 0) {
    h += `<button class="btn-full" onclick="reiniciarEjercito('${ej.id}')">
      Levantar ${caidas} miniatura${caidas !== 1 ? 's' : ''}
    </button>
    <div class="info-l" style="margin:5px 0 4px">
      Al terminar una partida: devuelve todas las unidades a su tamaño completo.
    </div>`;
  }

  if (!ej.unidades.length) {
    h += `<div class="nota-u">Este ejército todavía no tiene unidades. Añade la primera con su arma.</div>`;
  }

  ej.unidades.forEach(u => {
    const abierta = unidadesAbiertas.has(u.id);
    const vivas = contarVivas(u);
    const armas = armasDeUnidad(u);

    h += `<div class="uni${abierta ? ' open' : ''}">
      <div class="uni-top" onclick="toggleUnidad('${u.id}')">
        <span class="uni-n">${esc(u.nombre)}</span>
        <span class="uni-x">×${vivas}</span>
        <span class="uni-ch">${abierta ? '▲' : '▼'}</span>
      </div>`;

    if (!abierta) {
      const inv = u.inv ? ` Inv${u.inv}+` : '';
      h += `<div class="uni-sub">R${u.R} S${u.S}+${inv} ${u.heridas}H · ${armas.length} arma${armas.length !== 1 ? 's' : ''}</div>`;
    } else {
      h += `<div class="uni-det">
        <div class="uni-perf">
          <div class="up"><div class="up-l">R</div><div class="up-v">${u.R}</div></div>
          <div class="up"><div class="up-l">S</div><div class="up-v">${u.S}+</div></div>
          <div class="up"><div class="up-l">Inv</div><div class="up-v">${u.inv ? u.inv + '+' : '—'}</div></div>
          <div class="up"><div class="up-l">H</div><div class="up-v">${u.heridas}</div></div>
          <div class="up"><div class="up-l">Vivas</div><div class="up-v">${vivas}</div></div>
          <div class="up"><div class="up-l">Total</div><div class="up-v">${u.grupos.reduce((s, g) => s + g.modelos.length, 0)}</div></div>
        </div>

        <div class="uni-lbl">Armas</div>
        ${armas.map(w => `
          <div class="uni-arma" onclick="sheetArma('${u.id}','${w.grupoId}','${w.perfilId || ''}')">
            <div class="uni-arma-t">
              <div class="uni-arma-n">${esc(w.n)}${w.auto && w.auto.rafaga ? ' · ráfaga' : ''}</div>
              <div class="uni-arma-s">${w.tipo === 'cc' ? 'Combate' : 'Disparo'} · A${esc(w.A)} · ${w.tipo === 'cc' ? 'HA' : 'HP'}${w.auto && w.auto.rafaga ? '—' : w.hab + '+'} · F${w.F} · PA${w.FP} · Daño ${esc(w.D)}</div>
            </div>
            <span class="uni-lap">✎</span>
          </div>`).join('')}
        <div class="uni-add" onclick="sheetArma('${u.id}', null)">+ Añadir arma</div>

        <!-- Tres botones a partes iguales: «✎ Editar unidad» no cabía a
             375 px con un tercero al lado, así que se queda en «✎ Editar» -->
        <div class="uni-btns">
          <div class="uni-bt" onclick="sheetEditarUnidad('${u.id}')">✎ Editar</div>
          <div class="uni-bt" onclick="duplicarUnidad('${u.id}')">⧉ Duplicar</div>
          <div class="uni-bt del" onclick="borrarUnidad('${u.id}')">Eliminar</div>
        </div>
      </div>`;
    }
    h += `</div>`;
  });

  h += `<button class="btn-full dashed" style="margin-top:10px" onclick="sheetAltaUnidad('${ej.id}')">+ Añadir unidad</button>`;
  h += `<div class="info-l">El bando se cambia desde el menú ☰, para no tocarlo sin querer durante la partida.</div>`;

  document.getElementById('ejercito-cont').innerHTML = h;
}

// Cuántas miniaturas caídas tiene un ejército entero
const contarCaidas = ej => (ej.unidades || []).reduce((s, u) =>
  s + (u.grupos || []).reduce((t, g) =>
    t + (g.modelos || []).filter(m => !m.vivo).length, 0), 0);

// ── REINICIAR EL EJÉRCITO ──
// Para empezar otra partida. Es lo contrario de «Aplicar bajas», así que pide
// confirmación igual que ella: rehace el estado de toda una partida.
function reiniciarEjercito(ejId) {
  const armies = todosEjercitos();
  const ej = armies[ejId];
  if (!ej) return;

  const caidas = contarCaidas(ej);
  if (!caidas) return;
  if (!confirm(`¿Levantar las ${caidas} miniaturas caídas de ${ej.nombre}?\n\n`
             + 'Todas sus unidades vuelven a su tamaño completo. Se usa al '
             + 'terminar una partida.')) return;

  (ej.unidades || []).forEach(u => (u.grupos || []).forEach(g =>
    (g.modelos || []).forEach(m => { m.vivo = true; })));
  guardarJSON(LS_ARMIES, armies);

  // El deshacer apuntaba a miniaturas de este ejército: ya están todas en pie,
  // así que usarlo no haría nada y el aviso solo confundiría
  if (ultimasBajas && (ej.unidades || []).some(u => u.id === ultimasBajas.unitId)) {
    ultimasBajas = null;
  }

  // Los bandos elegidos llevan copiado el recuento de miniaturas; si son de
  // este ejército, acaba de quedarse corto
  if (S.def.ejId === ejId && S.def.unitId) {
    const u = buscarUnidad(S.def.unitId);
    if (u) S.def.minis = contarVivas(u);
  }
  if (S.atk.ejId === ejId && S.atk.grupoId) {
    const un = buscarUnidad(S.atk.unitId);
    // Solo el recuento: volver a aplicar el arma entera apagaría las reglas
    // situacionales que hubiera puestas
    const w = un && armasDeUnidad(un).find(x =>
      x.grupoId === S.atk.grupoId && (x.perfilId || '') === (S.atk.perfilId || ''));
    if (w) S.atk.modelos = Math.max(1, w.minis || 1);
  }

  pintarEjercito();
  pintarTodo();
}

function toggleUnidad(id) {
  unidadesAbiertas.has(id) ? unidadesAbiertas.delete(id) : unidadesAbiertas.add(id);
  pintarEjercito();
}

function borrarUnidad(unitId) {
  const ej = ejercito(ejAbierto);
  const u = ej && ej.unidades.find(x => x.id === unitId);
  if (!u) return;
  if (!confirm(`¿Eliminar "${u.nombre}" de ${ej.nombre}? No se puede deshacer.`)) return;

  const armies = todosEjercitos();
  armies[ejAbierto].unidades = armies[ejAbierto].unidades.filter(x => x.id !== unitId);
  guardarJSON(LS_ARMIES, armies);
  unidadesAbiertas.delete(unitId);

  // Si la unidad borrada estaba elegida para tirar, se olvida
  if (S.atk.unitId === unitId) Object.assign(S.atk, { unitId: null, unidad: null, arma: null });
  if (S.def.unitId === unitId) Object.assign(S.def, { unitId: null, unidad: null });
  pintarEjercito();
}

// (Aquí vivía rotarRol(), que rotaba el bando al tocar un ejército en la
// pantalla de partida. Desde que esa tarjeta lleva a las unidades, el bando
// se cambia solo desde el cajón, con rotarRolDesdeCajon(). Quedó sin llamar.)

function guardarPartida() { guardarJSON(LS_PARTIDA, { ladoA: P.ladoA, ladoB: P.ladoB }); }

// ── Crear ejército rival vacío ──
function sheetNuevoEjercito() {
  abrirSheet(`
    <div class="grab"></div>
    <div class="sh-t">Nuevo ejército</div>
    <div class="fld">
      <span class="lbl">Nombre</span>
      <input class="form-i" id="inp-ej-nombre" placeholder="Ej. Orkos de Grukk" autocomplete="off">
    </div>
    <div class="fld">
      <span class="lbl">Facción</span>
      <input class="form-i" id="inp-ej-faccion" placeholder="Ej. Orkos, Necrones…" autocomplete="off">
    </div>
    <div class="sh-btns">
      <button class="b-canc" onclick="cerrarSheet()">Cancelar</button>
      <button class="b-ok" onclick="crearEjercito()">Crear</button>
    </div>
  `);
  setTimeout(() => { const el = document.getElementById('inp-ej-nombre'); if (el) el.focus(); }, 60);
}

function crearEjercito() {
  const nombre = (document.getElementById('inp-ej-nombre').value || '').trim();
  if (!nombre) { alert('Ponle un nombre al ejército'); return; }
  const faccion = (document.getElementById('inp-ej-faccion').value || '').trim();

  const armies = todosEjercitos();
  const ej = { id: uid(), nombre, faccion: faccion || 'Sin facción', unidades: [] };
  armies[ej.id] = ej;
  guardarJSON(LS_ARMIES, armies);

  if (!P.ladoA) P.ladoA = ej.id;
  else if (!P.ladoB) P.ladoB = ej.id;
  guardarPartida();
  cerrarSheet();
  pintarPartida();
}

function empezar() {
  // Deja algo elegido en cada bando para no entrar a una pantalla vacía
  autoSeleccionar('atk', P.ladoA);
  autoSeleccionar('def', P.ladoB);
  verSetup();
}

// Deja algo elegido en ese bando SI NO HAY NADA, para no entrar a una
// pantalla vacía. Lo que ya estuviera elegido no se toca: volver a la tirada
// desde el cajón reseleccionaba siempre la primera unidad del ejército y
// perdías la que tenías preparada.
//
// No se comprueba de qué bando es la unidad, solo que siga existiendo y que
// su ejército siga jugando: elegir una unidad del ejército contrario está
// permitido a propósito (heridas mortales a los tuyos, tiradas hipotéticas),
// pero arrastrar una de una partida anterior no tendría sentido.
function autoSeleccionar(lado, ejId) {
  const lo = lado === 'atk' ? S.atk : S.def;
  const sigueJugando = lo.ejId === P.ladoA || lo.ejId === P.ladoB;
  const conArma = lado === 'def' || !!lo.arma;
  if (lo.unitId && buscarUnidad(lo.unitId) && sigueJugando && conArma) return;

  const ej = ejercito(ejId);
  const u = (ej && ej.unidades || []).find(x => contarVivas(x) > 0) || (ej && ej.unidades || [])[0];
  if (!u) {
    if (lado === 'atk') Object.assign(S.atk, { ejId, unitId: null, unidad: null, arma: null });
    else Object.assign(S.def, { ejId, unitId: null, unidad: null });
    return;
  }
  if (lado === 'atk') elegirUnidadAtk(u.id, ejId, true);
  else elegirUnidadDef(u.id, ejId, true);
}

// ═══════════════════════════════════════════════════════════
//  INVERTIR BANDOS
//  Intercambia los ejércitos y, si ambas unidades vienen de un ejército,
//  también el atacante y el defensor: el que acaba de recibir pasa a disparar.
// ═══════════════════════════════════════════════════════════
function invertirBandos() {
  const a = P.ladoA; P.ladoA = P.ladoB; P.ladoB = a;
  guardarPartida();

  const viejoAtk = S.atk.unitId, viejoAtkEj = S.atk.ejId;
  const viejoDef = S.def.unitId, viejoDefEj = S.def.ejId;

  if (viejoAtk && viejoDef) {
    elegirUnidadAtk(viejoDef, viejoDefEj, true);
    elegirUnidadDef(viejoAtk, viejoAtkEj, true);
  } else {
    autoSeleccionar('atk', P.ladoA);
    autoSeleccionar('def', P.ladoB);
  }
  pintarTodo();
}

// Invertir desde el resultado tiene que llevar además al lanzador: si no,
// cambia los bandos por detrás y te deja mirando la tirada anterior.
function invertirYLanzar() { invertirBandos(); verSetup(); }

// ═══════════════════════════════════════════════════════════
//  SELECCIÓN DEL ATACANTE
// ═══════════════════════════════════════════════════════════
function sheetUnidadAtk() {
  let h = `<div class="grab"></div><div class="sh-t">Unidad atacante</div>`;
  h += bloqueEjercito(P.ladoA, 'atk', true);
  h += bloqueEjercito(P.ladoB, 'atk', false);
  h += `<div class="sh-btns" style="margin-top:12px">
    <button class="b-canc" onclick="verPartida()">Partida</button>
    <button class="b-ok" onclick="cerrarSheet()">Cerrar</button>
  </div>`;
  abrirSheet(h);
}

function sheetUnidadDef() {
  let h = `<div class="grab"></div><div class="sh-t">Unidad defensora</div>`;
  h += bloqueEjercito(P.ladoB, 'def', true);
  h += bloqueEjercito(P.ladoA, 'def', false);
  h += `<div class="sh-btns" style="margin-top:12px">
    <button class="b-canc" onclick="verPartida()">Partida</button>
    <button class="b-ok" onclick="cerrarSheet()">Cerrar</button>
  </div>`;
  abrirSheet(h);
}

// Un bloque de unidades por ejército. `propio` marca el ejército del bando
// que toca, que va primero y resaltado.
function bloqueEjercito(ejId, lado, propio) {
  const ej = ejercito(ejId);
  if (!ej) return '';
  const sel = lado === 'atk' ? S.atk.unitId : S.def.unitId;
  const fn  = lado === 'atk' ? 'elegirUnidadAtk' : 'elegirUnidadDef';

  let h = `<div class="grp-t${propio ? ' act' : ''}">${esc(ej.nombre)}</div>`;

  if (!(ej.unidades || []).length) {
    h += `<div class="nota-u">Este ejército no tiene unidades todavía.</div>`;
  }

  (ej.unidades || []).forEach(u => {
    const vivas = contarVivas(u);
    const nArmas = armasDeUnidad(u).length;
    h += `<div class="uitem${sel === u.id ? ' on' : ''}${vivas === 0 ? ' muerta' : ''}"
               onclick="${fn}('${u.id}','${ej.id}')">
      <div class="uitem-txt">
        <div class="uitem-n">${esc(u.nombre)}</div>
        <div class="uitem-s">${vivas === 0 ? 'Aniquilada' : vivas + ' viva' + (vivas !== 1 ? 's' : '')}
          · R${u.R} S${u.S}+${u.inv ? ' Inv' + u.inv + '+' : ''} · ${u.heridas || 1}H
          ${lado === 'atk' ? '· ' + nArmas + ' arma' + (nArmas !== 1 ? 's' : '') : ''}</div>
      </div>
      ${lado === 'atk' ? '<span class="pick-c">›</span>' : ''}
    </div>`;
  });

  h += `<button class="btn-full dashed" onclick="sheetAltaUnidad('${ej.id}')">+ Añadir unidad a ${esc(ej.nombre)}</button>`;
  return h;
}

function elegirUnidadAtk(unitId, ejId, silencioso) {
  const u = buscarUnidad(unitId);
  if (!u) return;
  const armas = armasDeUnidad(u);
  S.atk.ejId = ejId;
  S.atk.unitId = unitId;
  S.atk.unidad = u.nombre;
  if (armas.length) aplicarArma(armas[0]);
  else { S.atk.arma = null; S.atk.grupoId = null; S.atk.perfilId = null; pintarTodo(); }
  if (!silencioso) { if (armas.length > 1) sheetArmaAtk(); else cerrarSheet(); }
}

function armasActuales() {
  const u = S.atk.unitId ? buscarUnidad(S.atk.unitId) : null;
  return u ? armasDeUnidad(u) : [];
}

function sheetArmaAtk() {
  const armas = armasActuales();
  if (!armas.length) { sheetUnidadAtk(); return; }

  let h = `<div class="grab"></div>
    <div class="sh-t">Arma<div class="sh-t-sub">${esc(S.atk.unidad || '')}</div></div>`;

  armas.forEach(w => {
    const sel = S.atk.grupoId === w.grupoId && S.atk.perfilId === w.perfilId;
    h += `<div class="uitem${sel ? ' on' : ''}" onclick="elegirArma('${w.grupoId}','${w.perfilId || ''}')">
      <div class="uitem-txt">
        <div class="uitem-n">${esc(w.n)}</div>
        <div class="uitem-s">A${esc(w.A)} · F${w.F} · PA${w.FP} · Daño ${esc(w.D)} · ${w.tipo === 'cc' ? 'HA' : 'HP'}${w.hab}+ · ${w.minis}m</div>
      </div>
      <span class="uitem-tag ${w.tipo}">${w.tipo === 'cc' ? 'Combate' : 'Disparo'}</span>
    </div>`;
  });

  h += `<div class="sh-btns" style="margin-top:12px">
    <button class="b-canc" onclick="sheetUnidadAtk()">← Otra unidad</button>
    <button class="b-ok" onclick="cerrarSheet()">Listo</button>
  </div>`;

  abrirSheet(h);
}

function elegirArma(grupoId, perfilId) {
  const w = armasActuales().find(x => x.grupoId === grupoId && (x.perfilId || '') === perfilId);
  if (!w) return;
  aplicarArma(w);
  cerrarSheet();
}

// Vuelca un arma en el estado del atacante. Las reglas `auto` se marcan solas
// y el resto se reinician, para no arrastrar lo marcado para el arma anterior.
function aplicarArma(w) {
  const auto = w.auto || {};
  Object.assign(S.atk, {
    arma: w.n, grupoId: w.grupoId, perfilId: w.perfilId,
    tipo: w.tipo, hab: w.hab,
    A: String(w.A), F: w.F, FP: w.FP, D: String(w.D),
    modelos: Math.max(1, w.minis || 1),
    rafaga: !!auto.rafaga, ignCob: !!auto.ignCob, repHer: !!auto.repHer,
    sus: !!auto.sus, susX: auto.susX || 1,
    letal: !!auto.letal, devast: !!auto.devast,
    rep: 'no', modImp: 0, modHer: 0,
    // Las situacionales se apagan al cambiar de arma: valían para la tirada
    // anterior, no para ésta
    anti: 0, area: 0, tajar: 0, pesada: false, lanza: false,
    fusion: 0, fuegoRap: 0, psiquica: false,
    modF: 0, modFP: 0, modD: 0
  });
  pintarTodo();
}

// ═══════════════════════════════════════════════════════════
//  SELECCIÓN DEL DEFENSOR
// ═══════════════════════════════════════════════════════════
function elegirUnidadDef(unitId, ejId, silencioso) {
  const u = buscarUnidad(unitId);
  if (!u) return;
  Object.assign(S.def, {
    ejId, unitId, unidad: u.nombre,
    R: u.R, S: u.S, inv: u.inv || 0, W: u.heridas || 1,
    minis: contarVivas(u),
    // El sin dolor viene de la unidad; antes se ponía a 0 aquí y había que
    // volver a marcarlo en cada tirada, con lo fácil que es olvidarlo
    fnp: u.fnp || 0,
    cob: false, hm: 0, modR: 0, modSalv: 0
  });
  pintarTodo();
  if (!silencioso) cerrarSheet();
}

// ═══════════════════════════════════════════════════════════
//  EDITOR DE UNIDADES Y ARMAS
//  Un único panel sirve para tres cosas según `nuevaU.modo`:
//    'alta'   → unidad nueva con su primera arma
//    'unidad' → el perfil defensivo de una unidad que ya existe
//    'arma'   → una sola arma: nueva (grupoId a null) o la que se ha tocado
//  Se hace así, y no con tres formularios, porque los campos son los mismos:
//  lo único que cambia es qué bloques se pintan y qué se guarda.
//  El multi-perfil (un arma con varios modos de disparo) se edita y también
//  se crea desde aquí: «+ Añadir arma» añade SIEMPRE otro modo del arma que
//  la unidad ya tiene, con las mismas miniaturas. Antes preguntaba a quién se
//  le daba el arma y cuántas la llevaban, y resultaba lioso de usar en plena
//  partida (decisión de Leo, 04/11/2026). Para que unas miniaturas lleven un
//  arma distinta se da de alta otra unidad («Guardianes» 9 y «Guardianes —
//  plataforma» 1), que además deja el recuento a la vista.
// ═══════════════════════════════════════════════════════════
let nuevaU = null;

function sheetAltaUnidad(ejId) {
  nuevaU = { modo: 'alta', ejId, unitId: null, grupoId: null, perfilId: null,
             nombre: '', R: 4, S: 4, inv: 0, heridas: 1, fnp: 0, minis: 5,
             aNombre: '', tipo: 'dist', hab: 3, A: '2', F: 4, FP: 0, D: '1', rafaga: false,
             ...autoAlta(null) };
  pintarAlta();
}

// ── DUPLICAR UNA UNIDAD ──
// Abre el panel de alta con TODO copiado de la original, para confirmar o
// ajustar antes de crear nada. Dar de alta una unidad son 21 controles y
// dentro de un ejército el perfil se repite casi siempre, así que copiar y
// renombrar es el camino corto.
//
// La copia nace entera: `modelos` se rehace con todas vivas aunque la
// original tenga bajas. Una unidad nueva no empieza herida.
function duplicarUnidad(unitId) {
  const ej = ejercito(ejAbierto);
  const u = ej && ej.unidades.find(x => x.id === unitId);
  if (!u) return;

  // Los grupos se copian en profundidad y con ids nuevos. Si compartieran id
  // con los de la original, editar un arma de una tocaría la de la otra.
  const grupos = JSON.parse(JSON.stringify(u.grupos || [])).map(g => {
    g.id = uid();
    if (g.perfiles) g.perfiles.forEach(p => { p.id = uid(); });
    g.modelos = (g.modelos || []).map(() => ({ id: uid(), vivo: true }));
    return g;
  });

  const primera = armasDeUnidad({ ...u, grupos })[0] || {};
  nuevaU = {
    modo: 'copia', ejId: ej.id, unitId: null, grupoId: null, perfilId: null,
    origen: u.nombre,
    nombre: nombreDeCopia(ej, u.nombre),
    R: u.R, S: u.S, inv: u.inv || 0, heridas: u.heridas || 1, fnp: u.fnp || 0,
    minis: (grupos[0] && grupos[0].modelos.length) || 1,
    nGrupos: grupos.length,
    gruposCopia: grupos,
    // Cuántas armas vienen además de la que se edita abajo: el panel de alta
    // solo sabe de una, y una copia a la que le faltan armas sería peor que
    // no tener el botón. El Vidente de la colección tiene dos perfiles.
    nArmas: armasDeUnidad({ ...u, grupos }).length,
    aNombre: primera.n || '', tipo: primera.tipo || 'dist', hab: primera.hab || 3,
    A: String(primera.A || '2'), F: primera.F || 4, FP: primera.FP || 0,
    D: String(primera.D || '1'),
    rafaga: !!(primera.auto && primera.auto.rafaga),
    ...autoAlta(primera.auto)
  };
  pintarAlta();
}

// «Guardianes» → «Guardianes (2)», y si ya existe, (3). Mirar si el nombre
// está libre evita dos unidades iguales en los selectores del lanzador.
function nombreDeCopia(ej, base) {
  const limpio = String(base).replace(/\s*\(\d+\)$/, '');
  const usados = new Set((ej.unidades || []).map(x => x.nombre));
  for (let i = 2; i < 99; i++) {
    const n = `${limpio} (${i})`;
    if (!usados.has(n)) return n;
  }
  return `${limpio} (copia)`;
}

// Solo el perfil defensivo. Las miniaturas se editan aquí, y este es ya el
// único sitio donde se tocan: el panel del arma perdió su contador.
// Una unidad creada desde este cambio tiene siempre un solo grupo, así que el
// contador sale siempre. Con varios grupos —unidades de antes— sería ambiguo
// a cuál aplicarlo, así que se avisa en vez de ofrecerlo.
function sheetEditarUnidad(unitId) {
  const ej = ejercito(ejAbierto);
  const u = ej && ej.unidades.find(x => x.id === unitId);
  if (!u) return;
  const unico = u.grupos.length === 1 ? u.grupos[0] : null;

  nuevaU = { modo: 'unidad', ejId: ej.id, unitId, grupoId: unico ? unico.id : null, perfilId: null,
             nombre: u.nombre, R: u.R, S: u.S, inv: u.inv || 0, heridas: u.heridas || 1,
             fnp: u.fnp || 0,
             minis: unico ? (unico.modelos || []).length : 0,
             nGrupos: u.grupos.length };
  pintarAlta();
}

// `grupoId` a null significa arma nueva. `perfilId` solo llega cuando se ha
// tocado un perfil concreto de un arma con varios modos de disparo.
function sheetArma(unitId, grupoId, perfilId) {
  const ej = ejercito(ejAbierto);
  const u = ej && ej.unidades.find(x => x.id === unitId);
  if (!u) return;

  const g = grupoId ? u.grupos.find(x => x.id === grupoId) : null;
  const p = (g && perfilId) ? (g.perfiles || []).find(x => x.id === perfilId) : null;
  const fuente = p || g;   // de dónde salen A/F/FP/D

  nuevaU = {
    modo: 'arma', ejId: ej.id, unitId,
    grupoId: g ? g.id : null,
    perfilId: p ? p.id : null,
    unidadNombre: u.nombre,
    nGrupos: u.grupos.length,
    nPerfiles: g && g.perfiles ? g.perfiles.length : 0,
    // Ya no hay ni `destino` ni `minis`: un arma nueva es siempre otro modo
    // del arma que la unidad tiene, con las mismas miniaturas, así que no hay
    // nada que repartir ni que contar. El recuento vive en la ficha de la
    // unidad y este panel no lo toca.
    // El nombre del arma a la que se añadirá, solo para avisar en pantalla
    destinoNombre: g ? '' : ((u.grupos[0] && u.grupos[0].nombre) || u.nombre),
    aNombre: fuente ? (fuente.nombre || '') : '',
    tipo: (p && p.tipo) || (g && g.tipo) || 'dist',
    hab:  (p && p.hab)  || (g && g.hab)  || 3,
    A: fuente ? String(fuente.A) : '2',
    F: fuente ? fuente.F : 4,
    FP: fuente ? fuente.FP : 0,
    D: fuente ? String(fuente.D) : '1',
    // `rafaga` vive suelta en el grupo o el perfil y las demás dentro de
    // `auto`: así lo dejó el modelo de datos del rastreador y así lo lee
    // armasDeUnidad(), que hace `{...p.auto, rafaga: !!p.rafaga}`
    rafaga: fuente ? !!fuente.rafaga : false,
    ...autoAlta(fuente && fuente.auto)
  };
  pintarAlta();
}

// Las habilidades que el lanzador sabe calcular y que se guardan EN EL ARMA.
// Son las seis de la sección 24 que no dependen de la situación: las otras
// ocho (anti, área, pesada, lanza…) cambian de una tirada a otra y viven en
// «Reglas especiales» del lanzador, no aquí.
const autoAlta = (auto) => ({
  ignCob: !!(auto && auto.ignCob),
  repHer: !!(auto && auto.repHer),
  sus:    !!(auto && auto.sus),
  susX:   (auto && auto.susX) || 1,
  letal:  !!(auto && auto.letal),
  devast: !!(auto && auto.devast)
});

// (Aquí vivía `sacarModelos`, que repartía miniaturas de las armas existentes
// a un grupo nuevo. Al quitar la pregunta de quién lleva el arma no se crean
// grupos nuevos desde la interfaz, así que se quedó sin usar y se borró.)

// Convierte un grupo de un solo arma en multi-perfil: su A/F/FP/D pasan a ser
// el primer perfil y se quitan del grupo, que es donde el modelo de datos
// manda que vivan cuando hay perfiles. El grupo toma el nombre de la unidad
// para que la lista no repita ese nombre delante de cada perfil.
function aMultiPerfil(g, unidad) {
  if (g.perfiles && g.perfiles.length) return;
  g.perfiles = [{
    id: uid(), nombre: g.nombre || 'Arma',
    tipo: g.tipo, hab: g.hab,
    A: String(g.A), F: g.F, FP: g.FP, D: String(g.D), rafaga: !!g.rafaga
  }];
  ['A', 'F', 'FP', 'D', 'rafaga'].forEach(k => delete g[k]);
  g.nombre = unidad.nombre;
}

// Estira o recorta la lista de miniaturas de un grupo. Al recortar se quitan
// primero las muertas: así bajar el número no resucita a nadie.
function ajustarModelos(grupo, n) {
  const ms = grupo.modelos || (grupo.modelos = []);
  while (ms.length > n) {
    const i = ms.findIndex(m => !m.vivo);
    ms.splice(i >= 0 ? i : ms.length - 1, 1);
  }
  while (ms.length < n) ms.push({ id: uid(), vivo: true });
}

// Guarda lo escrito en los inputs antes de repintar, igual que hace el
// rastreador: si no, al tocar un chip se perderían los textos
function leerAlta() {
  if (!nuevaU) return;
  const n = document.getElementById('inp-u-nombre');
  const a = document.getElementById('inp-u-arma');
  if (n) nuevaU.nombre = n.value;
  if (a) nuevaU.aNombre = a.value;
}

function setAlta(campo, valor) {
  leerAlta();
  const num = ['R','S','inv','heridas','minis','hab','F','FP','susX','fnp'];
  nuevaU[campo] = num.includes(campo) ? parseInt(valor) : valor;
  pintarAlta();
}

function pasoAlta(campo, delta) {
  leerAlta();
  // `minis` admite 0 porque un arma puede llevarla ninguna miniatura
  // (el caso del arma de la plataforma o del arma suelta de un personaje)
  // `minis` ya solo se toca desde la ficha de la unidad, así que no hay más
  // tope que éste: el de las miniaturas que las otras armas podían ceder
  // desapareció con la pregunta de quién lleva el arma.
  const lim = { R: [1,14], heridas: [1,30], minis: [0,60], F: [1,20] }[campo] || [0,99];
  nuevaU[campo] = Math.max(lim[0], Math.min(lim[1], (nuevaU[campo] || 0) + delta));
  pintarAlta();
}

function togAlta(campo) {
  leerAlta();
  nuevaU[campo] = !nuevaU[campo];
  pintarAlta();
}

function pintarAlta() {
  const u = nuevaU;
  const ej = ejercito(u.ejId);
  const un = (ej && u.unitId) ? (ej.unidades || []).find(x => x.id === u.unitId) : null;
  const stepAlta = (campo, valor) => `<div class="stepr">
      <div class="sb" onclick="pasoAlta('${campo}',-1)">−</div>
      <div class="sn">${valor}</div>
      <div class="sb" onclick="pasoAlta('${campo}',1)">+</div>
    </div>`;
  const chipsAlta = (vals, actual, campo, apagado) => `<div class="chips">${vals.map(v => {
      const val = typeof v === 'object' ? v.v : v;
      const txt = typeof v === 'object' ? v.t : v;
      const sel = !apagado && String(val) === String(actual) ? ' on' : '';
      return `<div class="ch${sel}${apagado ? ' off' : ''}"${apagado ? '' : ` onclick="setAlta('${campo}','${val}')"`}>${esc(txt)}</div>`;
    }).join('')}</div>`;

  // Un atributo del arma: etiqueta corta arriba y desplegable debajo. Es lo
  // que forma la fila A / HA-HP / F / FP / D. `off` lo deja a la vista pero
  // inerte, que es como se marca la habilidad cuando el arma es de ráfaga.
  const selAtr = (campo, etiq, vals, actual, off) => {
    const ops = vals.map(v => {
      const val = typeof v === 'object' ? v.v : v;
      const txt = typeof v === 'object' ? v.t : v;
      // Se compara en texto a propósito: `hab`, `F` y `FP` son números y `A`
      // y `D` son cadenas («D3»), y el value de un <option> siempre es cadena
      const sel = String(val) === String(actual) ? ' selected' : '';
      return `<option value="${esc(val)}"${sel}>${esc(txt)}</option>`;
    }).join('');
    return `<label class="atr">
      <span class="atr-l">${esc(etiq)}</span>
      <select class="atr-s"${off ? ' disabled' : ''}
              onchange="setAlta('${campo}',this.value)">${ops}</select>
    </label>`;
  };

  // ── Bloque del perfil defensivo de la unidad ──
  const bloqueUnidad = `
    <div class="fld">
      <span class="lbl">Nombre de la unidad</span>
      <input class="form-i" id="inp-u-nombre" value="${esc(u.nombre || '')}"
             placeholder="Ej. Chicos orkos" autocomplete="off">
    </div>

    ${(u.modo === 'alta' || u.grupoId || (u.modo === 'copia' && u.nGrupos === 1)) ? `
    <div class="fld">
      <span class="lbl">Miniaturas</span>
      ${stepAlta('minis', u.minis)}
    </div>` : `
    <div class="nota-u">
      Esta unidad se creó con ${u.nGrupos} armas repartidas entre miniaturas
      distintas, y su número ya no se cambia desde aquí. Si lo necesitas,
      vuelve a darla de alta.
    </div>`}

    <div class="form-row">
      <div class="fld">
        <span class="lbl">Resistencia</span>
        ${stepAlta('R', u.R)}
      </div>
      <div class="fld">
        <span class="lbl">Heridas por miniatura</span>
        ${stepAlta('heridas', u.heridas)}
      </div>
    </div>

    <div class="fld">
      <span class="lbl">Salvación</span>
      ${chipsAlta([{v:2,t:'2+'},{v:3,t:'3+'},{v:4,t:'4+'},{v:5,t:'5+'},{v:6,t:'6+'},{v:7,t:'—'}], u.S, 'S')}
    </div>

    <div class="fld">
      <span class="lbl">Salvación invulnerable</span>
      ${chipsAlta([{v:0,t:'—'},{v:2,t:'2+'},{v:3,t:'3+'},{v:4,t:'4+'},{v:5,t:'5+'},{v:6,t:'6+'}], u.inv, 'inv')}
    </div>

    <div class="fld">
      <span class="lbl">No hay dolor</span>
      ${chipsAlta([{v:0,t:'—'},{v:4,t:'4+'},{v:5,t:'5+'},{v:6,t:'6+'}], u.fnp || 0, 'fnp')}
      <span class="fld-nota">
        Habilidad de la unidad (24.12), no del arma que la ataca. Se guarda
        aquí y el lanzador la carga sola al elegirla como defensora; antes
        había que marcarla en cada tirada.
      </span>
    </div>`;

  // ── Bloque de un arma ──
  // Ya no se pregunta quién la lleva ni cuántas miniaturas: un arma nueva es
  // siempre otro modo de la que la unidad ya tiene, con las mismas miniaturas.
  // Solo queda una línea de aviso para que no parezca que se ha perdido algo.
  const armaNueva = u.modo === 'arma' && !u.grupoId;

  // ── Habilidades del arma ──
  // Las seis que el lanzador sabe calcular sin saber nada de la mesa.
  // Ráfaga e ignora cobertura **solo salen a distancia**: la cobertura de 11ª
  // (13.08) únicamente afecta a ataques a distancia, y un arma de combate que
  // impactase sola no tiene sentido. Las otras cuatro valen en los dos casos.
  const togA = (campo, texto, sub) => `
    <div class="tog${u[campo] ? ' on' : ''}" onclick="togAlta('${campo}')">
      <div class="tog-b">✓</div>
      <div class="tog-txt">
        <div class="tog-t">${texto}</div>
        <div class="tog-sub">${sub}</div>
      </div>
    </div>`;

  const bloqueHabilidades = () => {
    const dist = u.tipo !== 'cc';
    return `
    <hr class="sec-div">
    <div class="lbl" style="margin-bottom:9px">Habilidades del arma</div>
    ${dist ? togA('rafaga', 'Ráfaga', 'Impacta sola, sin tirada') : ''}
    ${dist ? togA('ignCob', 'Ignora cobertura', 'El blanco no se beneficia de cobertura') : ''}
    ${togA('letal',  'Impactos letales', 'El 6 al impactar hiere solo; el blanco salva igual')}
    ${togA('devast', 'Heridas devastadoras', 'El 6 al herir inflige el Daño en mortales')}
    ${togA('repHer', 'Acoplada', 'Repite las tiradas para herir fallidas')}
    ${togA('sus',    'Golpes sostenidos', `${u.susX || 1} impacto${(u.susX || 1) !== 1 ? 's' : ''} extra por cada 6 al impactar`)}
    ${u.sus ? `
    <div class="fld" style="margin-top:-2px">
      <span class="lbl">La X de [Golpes sostenidos X]</span>
      ${chipsAlta([1,2,3], u.susX || 1, 'susX')}
    </div>` : ''}
    <div class="fld-nota" style="margin-top:4px">
      Las que dependen del momento —anti, área, pesada, lanza, fusión, fuego
      rápido, tajar y psíquica— se marcan al tirar, en «Reglas especiales».
    </div>`;
  };
  const bloqueArma = `
    <div class="fld">
      <span class="lbl">Nombre del arma</span>
      <input class="form-i" id="inp-u-arma" value="${esc(u.aNombre || '')}"
             placeholder="Ej. Pistola slugga" autocomplete="off">
    </div>

    ${armaNueva && u.destinoNombre ? `
    <div class="nota-u">
      Se añade como otro modo de ${esc(u.destinoNombre)}: la llevan las mismas
      miniaturas y el recuento de la unidad no cambia.
    </div>` : ''}

    <div class="fld">
      <span class="lbl">Tipo</span>
      <div class="seg">
        <div class="seg-i${u.tipo === 'dist' ? ' on' : ''}" onclick="setAlta('tipo','dist')">Disparo</div>
        <div class="seg-i${u.tipo === 'cc' ? ' on' : ''}" onclick="setAlta('tipo','cc')">Combate</div>
      </div>
    </div>

    <div class="fld">
      <div class="atr-row">
        ${selAtr('A',   'A',  ['1','2','3','4','5','6','D3','D6','2D6'], u.A)}
        ${selAtr('hab', u.tipo === 'cc' ? 'HA' : 'HP',
                 [2,3,4,5,6].map(v => ({ v, t: v + '+' })), u.hab, u.rafaga)}
        ${selAtr('F',   'F',  Array.from({length:20}, (_,i) => i + 1), u.F)}
        ${selAtr('FP',  'FP', [0,-1,-2,-3,-4,-5], u.FP)}
        ${selAtr('D',   'D',  OPC_DAÑO, u.D)}
      </div>
      <span class="fld-nota">${u.rafaga
        ? 'La habilidad no se usa: ráfaga impacta automáticamente.'
        : `Ataques · ${u.tipo === 'cc' ? 'habilidad de armas' : 'habilidad de proyectiles'} · fuerza · penetración de armadura · daño.`}</span>
    </div>

    ${bloqueHabilidades()}`;

  // ── Cabecera, cuerpo y botones según el modo ──
  let titulo, sub, cuerpo, textoOk, extraBtn = '';

  if (u.modo === 'alta') {
    titulo = 'Nueva unidad';
    sub = ej ? ej.nombre : '';
    cuerpo = bloqueUnidad +
      `<hr class="sec-div"><div class="lbl" style="margin-bottom:9px">Su arma</div>` + bloqueArma +
      `<div class="nota-u">Luego podrás añadirle más armas desde su ficha.</div>`;
    textoOk = 'Añadir unidad';

  } else if (u.modo === 'copia') {
    titulo = 'Duplicar unidad';
    sub = `copia de ${u.origen}`;
    cuerpo = bloqueUnidad
      + `<hr class="sec-div"><div class="lbl" style="margin-bottom:9px">Su arma</div>`
      + bloqueArma
      + (u.nArmas > 1 ? `<div class="nota-u">
          ${u.nArmas === 2
            ? 'Se copia también su otra arma, tal cual. Aquí solo se edita la primera; la otra, luego desde su ficha.'
            : `Se copian también sus otras ${u.nArmas - 1} armas, tal cual. Aquí solo se edita la primera; las demás, luego desde su ficha.`}
        </div>` : '')
      + `<div class="nota-u">La copia nace con todas las miniaturas en pie,
          aunque ${esc(u.origen)} tenga bajas.</div>`;
    textoOk = 'Crear copia';

  } else if (u.modo === 'unidad') {
    titulo = 'Editar unidad';
    sub = ej ? ej.nombre : '';
    cuerpo = bloqueUnidad;
    textoOk = 'Guardar';

  } else {
    titulo = u.grupoId ? 'Editar arma' : 'Nueva arma';
    sub = u.unidadNombre;
    cuerpo = bloqueArma;
    textoOk = u.grupoId ? 'Guardar' : 'Añadir arma';
    // Solo se puede borrar si queda algo detrás: ni la única arma de la
    // unidad ni el único perfil de un arma multi-perfil
    const puedeBorrar = u.grupoId && (u.perfilId ? u.nPerfiles > 1 : u.nGrupos > 1);
    if (puedeBorrar) {
      extraBtn = `<div class="uni-bt del" style="margin-top:10px" onclick="borrarArmaAlta()">Eliminar esta arma</div>`;
    } else if (u.grupoId) {
      extraBtn = `<div class="nota-u">No se puede eliminar: es lo único que tiene.
        Elimina la unidad entera si ya no la quieres.</div>`;
    }
  }

  abrirSheet(`
    <div class="grab"></div>
    <div class="sh-t">${titulo}${sub ? `<div class="sh-t-sub">${esc(sub)}</div>` : ''}</div>
    ${cuerpo}
    ${extraBtn}
    <div class="sh-btns">
      <button class="b-canc" onclick="cerrarSheet()">Cancelar</button>
      <button class="b-ok" onclick="guardarAlta()">${textoOk}</button>
    </div>
  `);
}

function guardarAlta() {
  leerAlta();
  const u = nuevaU;

  const armies = todosEjercitos();
  const ej = armies[u.ejId];
  if (!ej) { alert('Ese ejército ya no existe.'); cerrarSheet(); return; }

  // Los valores del arma, tal y como se guardan en un grupo o en un perfil
  const campsArma = () => {
    // Ráfaga e ignora cobertura solo existen a distancia: si el arma pasa a
    // combate se apagan al guardar, no solo se dejan de pintar. Si no, un
    // arma que fue de disparo seguiría impactando sola en cuerpo a cuerpo
    const cc = u.tipo === 'cc';
    return {
      nombre: (u.aNombre || '').trim() || 'Arma',
      tipo: u.tipo, hab: u.hab,
      A: String(u.A), F: u.F, FP: u.FP, D: String(u.D),
      rafaga: !cc && !!u.rafaga,
      auto: {
        ignCob: !cc && !!u.ignCob,
        repHer: !!u.repHer,
        sus: !!u.sus, susX: u.susX || 1,
        letal: !!u.letal, devast: !!u.devast
      }
    };
  };

  if (u.modo === 'copia') {
    if (!(u.nombre || '').trim()) { alert('Ponle un nombre a la unidad'); return; }

    const grupos = u.gruposCopia;
    // Lo editado en el panel se vuelca sobre la PRIMERA arma, que es la que
    // el panel enseña. Las demás van tal cual.
    const g0 = grupos[0];
    if (g0) {
      const campos = campsArma();
      if (g0.perfiles && g0.perfiles.length) {
        // En un arma multi-perfil, A/F/FP/D viven en el perfil y no en el
        // grupo: escribirlos en el grupo los dejaría ahí sin que nadie los lea
        Object.assign(g0.perfiles[0], campos);
        delete g0.perfiles[0].auto;
        g0.perfiles[0].auto = campos.auto;
      } else {
        Object.assign(g0, campos);
      }
      // El contador solo se ofrece con un grupo; con varios, cada uno
      // conserva el suyo, igual que al editar una unidad de antes
      if (grupos.length === 1) ajustarModelos(g0, Math.max(1, u.minis));
    }

    ej.unidades.push({
      id: uid(), nombre: u.nombre.trim(),
      R: u.R, S: u.S, inv: u.inv || 0, heridas: u.heridas || 1, fnp: u.fnp || 0,
      grupos
    });
    guardarJSON(LS_ARMIES, armies);
    trasGuardar(null);
    return;
  }

  if (u.modo === 'alta') {
    if (!(u.nombre || '').trim()) { alert('Ponle un nombre a la unidad'); return; }
    if (u.minis < 1) { alert('La unidad necesita al menos una miniatura'); return; }

    ej.unidades.push({
      id: uid(), nombre: u.nombre.trim(),
      R: u.R, S: u.S, inv: u.inv || 0, heridas: u.heridas || 1, fnp: u.fnp || 0,
      grupos: [Object.assign(campsArma(), {
        id: uid(),
        modelos: Array.from({ length: u.minis }, () => ({ id: uid(), vivo: true }))
      })]
    });
    guardarJSON(LS_ARMIES, armies);
    trasGuardar(null);
    return;
  }

  const un = ej.unidades.find(x => x.id === u.unitId);
  if (!un) { alert('Esa unidad ya no existe.'); cerrarSheet(); return; }

  if (u.modo === 'unidad') {
    if (!(u.nombre || '').trim()) { alert('Ponle un nombre a la unidad'); return; }
    Object.assign(un, {
      nombre: u.nombre.trim(),
      R: u.R, S: u.S, inv: u.inv || 0, heridas: u.heridas || 1,
      fnp: u.fnp || 0
    });
    // Solo se tocan las miniaturas si el panel las mostraba (un único arma)
    if (u.grupoId) {
      const g = un.grupos.find(x => x.id === u.grupoId);
      if (g) ajustarModelos(g, u.minis);
    }

  } else {
    if (u.grupoId) {
      const g = un.grupos.find(x => x.id === u.grupoId);
      if (!g) { alert('Esa arma ya no existe.'); cerrarSheet(); return; }
